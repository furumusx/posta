<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>POSTA - 定型文 × 利益計算</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--card2:#eef0f3;--line:#dde1e7;--tx:#16191f;--mut:#6b7280;--acc:#2f6fed;--acc-tx:#ffffff;
  --pos:#14894a;--neg:#d23b3b;--star:#e0a100;
  --tabh:58px;--safe:env(safe-area-inset-bottom,0px);--sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--r-lg:14px;--r-md:10px;--r-sm:8px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#181b22;--card2:#1f232c;--line:#2b303b;--tx:#e9ecf2;--mut:#98a1b0;--acc:#5aa9ff;--acc-tx:#04203f;
  --pos:#2fd27a;--neg:#ff6b6b;--star:#f5c84d;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{touch-action:manipulation;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{flex:none;display:flex;align-items:center;gap:var(--sp2);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:19px;margin:0;letter-spacing:.1em;flex:1}
header .v{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:var(--sp3) var(--sp3) calc(var(--tabh) + var(--safe) + 24px)}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe);height:calc(var(--tabh) + var(--safe))}
nav#tabs button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
nav#tabs button .i{font-size:20px;line-height:1}
nav#tabs button.on{color:var(--tx);font-weight:700}
nav#tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp3);margin-bottom:var(--sp2)}
.row{display:flex;gap:var(--sp2);align-items:center}
.grow{flex:1;min-width:0}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:44px;padding:0 var(--sp3);font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-tx);font-weight:700}
.btn.dng{color:var(--neg)}
.btn.sm{height:32px;padding:0 var(--sp2);font-size:12px;border-radius:var(--r-sm)}
.btn.wide{flex:1}
.btns{display:flex;gap:var(--sp2);flex-wrap:wrap}
.srch{display:flex;gap:var(--sp2);margin-bottom:var(--sp2)}
.srch input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);height:44px;padding:0 var(--sp3)}
.chips{display:flex;gap:var(--sp2);overflow-x:auto;margin-bottom:var(--sp2);padding-bottom:2px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;height:32px;padding:0 var(--sp3);font-size:13px;color:var(--mut);display:inline-flex;align-items:center}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-tx);font-weight:700}
.fld{margin-bottom:var(--sp3);min-width:0}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:var(--sp1)}
.fld input,.fld select,.fld textarea{width:100%;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:44px;padding:0 var(--sp2)}
.fld textarea{height:auto;min-height:200px;padding:var(--sp2);line-height:1.6}
.sec{font-size:13px;color:var(--mut);margin:var(--sp4) var(--sp1) var(--sp2);font-weight:700}
.note{font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
/* 定型文 */
.tp{display:flex;gap:var(--sp2);align-items:flex-start}
.tp .body{flex:1;min-width:0;cursor:pointer}
.tp .t{font-weight:700;overflow-wrap:anywhere}
.tp .b{font-size:13px;color:var(--mut);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.tp .tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;font-weight:400;white-space:nowrap}
.tp .side{display:flex;flex-direction:column;gap:6px;flex:none}
.star{width:40px;height:36px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card2);font-size:18px;line-height:1;color:var(--mut)}
.star.on{color:var(--star);border-color:var(--star)}
.hint{font-size:11px;color:var(--acc);margin-top:4px}
/* 計算（iOS設定画面風のグループリスト） */
.gl{font-size:13px;color:var(--mut);margin:var(--sp3) 16px 6px}
.gl:first-child{margin-top:var(--sp1)}
.gc{background:var(--card);border-radius:20px;overflow:hidden}
.gr{display:flex;align-items:center;gap:var(--sp2);min-height:52px;padding:0 16px;position:relative;font-size:17px;cursor:text}
.gr+.gr::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.gr .lb{flex:none}
.gr input{flex:1;min-width:0;border:0;background:transparent;outline:none;text-align:right;font-size:17px;padding:0;height:50px;font-variant-numeric:tabular-nums;color:var(--tx)}
.gr input::placeholder{color:var(--mut)}
.gr .u{flex:none;color:var(--mut);min-width:1.1em;text-align:right}
.gr .val{flex:1;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.gr .val.pos{color:var(--pos)}.gr .val.neg{color:var(--neg)}
.gb{display:block;width:100%;min-height:50px;border:0;background:transparent;color:var(--acc);font-size:17px;text-align:center;position:relative}
.gb+.gb::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.gn{font-size:12px;color:var(--mut);margin:6px 16px 0}
details.gset{margin-top:var(--sp3)}
details.gset summary{list-style:none;font-size:13px;color:var(--mut);margin:0 16px 6px;cursor:pointer}
details.gset summary::-webkit-details-marker{display:none}
details.gset summary::after{content:" ▸"}details.gset[open] summary::after{content:" ▾"}
@media (max-height:760px){.gr{min-height:44px;font-size:16px}.gr input{height:42px;font-size:16px}.gb{min-height:44px;font-size:16px}.gl{margin:10px 16px 4px}.gn{margin-top:3px;font-size:11px}
  .gbtns{display:flex}.gbtns .gb{flex:1}.gbtns .gb+.gb::before{top:8px;bottom:8px;left:0;right:auto;border-top:0;border-left:1px solid var(--line)}}
@media (max-height:700px){main{padding-top:6px}.gr{min-height:39px}.gr input{height:37px}.gb{min-height:39px}.gl{margin:7px 16px 3px;font-size:12px}.gn{margin-top:2px;line-height:1.35}.gc[style]{margin-top:7px!important}details.gset{margin-top:8px}}
@media (max-height:600px){main{padding-top:4px}.gr{min-height:35px;font-size:15px}.gr input{height:33px;font-size:16px}.gb{min-height:36px;font-size:15px}.gl{margin:5px 16px 2px;font-size:12px}.gn{margin-top:2px;font-size:11px;line-height:1.3}.gc[style]{margin-top:5px!important}header{padding-top:calc(env(safe-area-inset-top,0px) + 4px);padding-bottom:4px}details.gset{margin-top:6px}}
/* シート */
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#sheet[hidden]{display:none}
#sheet .sh{display:flex;align-items:center;gap:var(--sp2);padding:calc(env(safe-area-inset-top,0px) + 12px) var(--sp3) var(--sp3);border-bottom:1px solid var(--line);background:var(--card)}
#sheet .sh h2{font-size:17px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .sb{flex:1;overflow:auto;padding:var(--sp3) var(--sp3) calc(40px + var(--safe))}
.pv{white-space:pre-wrap;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp2);font-size:13px;line-height:1.6;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 60px);z-index:70;background:#2a3140;color:#fff;padding:var(--sp3) var(--sp4);border-radius:var(--r-md);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>POSTA</h1><span class="v" id="ver"></span></header>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="tpl"><span class="i">💬</span>定型文</button>
  <button data-tab="calc"><span class="i">🧮</span>計算</button>
</nav>
<div id="sheet" hidden><div class="sh"><h2 id="shT"></h2><button class="btn sm" data-act="closeSheet">閉じる</button></div><div class="sb" id="shB"></div></div>
<div id="toast"></div>
<script>
'use strict';
const APP_VER='2.0.2';
const KEY='posta_v2',OLD_KEY='posta_v1';
const TCATS=['買った時','売れた時','コメント','受取評価','その他'];
const VARS=['{商品名}','{価格}','{状態}','{発送方法}','{今日}'];
const OLD_CH_FEE={mercari:10,yahoo:5,rakuma:10,yahuoku:10};

/* ---------- 保存 ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function presets(){const t=Date.now();const P=[
  ['買った時','購入の挨拶','購入させていただきました。お取引が完了するまで、よろしくお願いいたします。'],
  ['売れた時','購入お礼＋発送予定','この度は {商品名} をご購入いただき、ありがとうございます。{今日}〜2日以内に発送いたします。発送後に改めてご連絡しますので、よろしくお願いいたします。'],
  ['売れた時','発送完了の連絡','発送が完了しましたのでご連絡いたします。お手元に届くまで今しばらくお待ちください。よろしくお願いいたします。'],
  ['コメント','値下げ交渉へのお返事（受ける）','コメントありがとうございます。ご提示の金額でお譲りできますので、価格を変更いたしました。ご検討よろしくお願いいたします。'],
  ['コメント','値下げ交渉へのお返事（断る）','コメントありがとうございます。申し訳ありませんが、{商品名} は現在の価格が限界のため、値下げはお受けできません。ご理解いただけますと幸いです。'],
  ['コメント','バラ売りについて','コメントありがとうございます。申し訳ありませんが、こちらはセットでの販売のみとなっております。バラ売りは行っておりませんので、ご了承ください。'],
  ['コメント','帯・初版の質問への回答','コメントありがとうございます。帯・初版の有無については、商品写真と説明文に記載の通りとなります。追加の写真が必要でしたらお知らせください。'],
  ['受取評価','受取評価のお願い','無事に届きましたでしょうか。問題がなければ、受取評価をよろしくお願いいたします。こちらも届き次第、評価させていただきます。'],
  ['受取評価','取引完了のお礼','受取評価ありがとうございました。こちらも評価させていただきました。またご縁がありましたら、よろしくお願いいたします。'],
  ['買った時','受け取りました','商品を受け取りました。迅速で丁寧なご対応をありがとうございました。またご縁がありましたら、よろしくお願いいたします。']];
  return P.map(([c,ti,b],i)=>({id:uid()+i,category:c,title:ti,body:b,fav:0,createdAt:t+i,updatedAt:t+i}))}
function defSettings(){return{feePct:10,ship:210}}
function normTpl(t){if(!t||typeof t!=='object')return null;const n=Date.now();
  return{id:String(t.id||uid()),category:String(t.category||'その他'),title:String(t.title||t.name||''),body:String(t.body||t.text||''),fav:t.fav?1:0,createdAt:t.createdAt||n,updatedAt:t.updatedAt||n}}
function fix(s){if(!s||typeof s!=='object')s={};
  s.templates=Array.isArray(s.templates)?s.templates.map(normTpl).filter(Boolean):presets();
  s.settings=Object.assign(defSettings(),s.settings||{});s.schema=2;return s}
// 初回：旧POSTA（posta_v1）から「定型文」と「設定」だけを引き継ぐ。出品メモ・記録は読まない。旧データは消さずにそのまま残す。
function migrate(){let o=null;try{const t=localStorage.getItem(OLD_KEY);if(t)o=JSON.parse(t)}catch(e){}
  if(!o||typeof o!=='object')return fix({templates:presets()});
  const st=o.settings||{};const set=defSettings();
  if(st.channel&&OLD_CH_FEE[st.channel]!=null)set.feePct=OLD_CH_FEE[st.channel];
  for(const [k,v] of [['feePct',st.feePct],['ship',st.ship]])if(v!==undefined&&v!==''&&isFinite(Number(v)))set[k]=Number(v);
  const tpl=Array.isArray(o.templates)?o.templates:null;
  return fix({templates:tpl?tpl:presets(),settings:set,migratedFrom:OLD_KEY,migratedAt:new Date().toISOString()})}
function load(){try{const t=localStorage.getItem(KEY);if(t)return fix(JSON.parse(t))}catch(e){}
  const s=migrate();try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}return s}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('保存できませんでした（端末の保存容量不足の可能性）');return false}}

/* ---------- 小道具 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(v){if(v===null||v===undefined||v==='')return NaN;if(typeof v==='number')return v;const t=String(v).normalize('NFKC').replace(/[,¥￥円%％\s]/g,'');if(t==='')return NaN;const n=Number(t);return isFinite(n)?n:NaN}
const yen=n=>(n<0?'-¥':'¥')+Math.abs(Math.round(n)).toLocaleString('ja-JP');
function ymd(t){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('コピーしました');return true}catch(e){
  const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);
  let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();toast(ok?'コピーしました':'コピーできませんでした');return ok}}
function openSheet(t,h){$('#shT').textContent=t;$('#shB').innerHTML=h;$('#sheet').hidden=false;$('#shB').scrollTop=0}
function closeSheet(){$('#sheet').hidden=true;TEDIT=null;FILL=null}

/* ============================================================
   定型文
   ============================================================ */
const UI={tab:'tpl',tq:'',tcat:'all'};
function todayJ(){const d=new Date();return `${d.getMonth()+1}月${d.getDate()}日`}
// {今日} 以外の {…} を拾う（同じ変数は1回だけ聞く）
function varsOf(body){const out=[];String(body).replace(/\{([^{}\n]{1,20})\}/g,(m,n)=>{if(n!=='今日'&&!out.includes(n))out.push(n);return m});return out}
function tplHTML(){
  const q=UI.tq.normalize('NFKC').toLowerCase();let arr=S.templates.slice();
  if(UI.tcat!=='all')arr=arr.filter(t=>t.category===UI.tcat);
  if(q)arr=arr.filter(t=>(t.title+' '+t.body).normalize('NFKC').toLowerCase().includes(q));
  arr.sort((a,b)=>(b.fav-a.fav)||((a.order??a.createdAt)-(b.order??b.createdAt)));
  const cats=[...new Set([...TCATS,...S.templates.map(t=>t.category)])];
  return `<div class="srch"><input id="tq" type="search" placeholder="定型文を検索" value="${esc(UI.tq)}"><button class="btn pri" data-act="newTpl">＋追加</button></div>
  <div class="chips"><button class="chip ${UI.tcat==='all'?'on':''}" data-act="tChip" data-v="all">すべて</button>${cats.map(c=>`<button class="chip ${UI.tcat===c?'on':''}" data-act="tChip" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div class="note" style="margin:0 4px 8px">本文をタップでコピー。★を付けた定型文は一番上に並びます。</div>
  ${arr.map(t=>{const vs=varsOf(t.body);return `<div class="card tp"><div class="body" data-act="tplCopy" data-id="${esc(t.id)}">
    <div class="t">${esc(t.title||'（名前なし）')}<span class="tag">${esc(t.category)}</span></div>
    <div class="b">${esc(t.body.length>90?t.body.slice(0,90)+'…':t.body)}</div>
    ${vs.length?`<div class="hint">コピー時に入力：${vs.map(v=>esc('{'+v+'}')).join(' ')}</div>`:''}</div>
    <div class="side"><button class="star ${t.fav?'on':''}" data-act="tplFav" data-id="${esc(t.id)}" aria-label="お気に入り">${t.fav?'★':'☆'}</button><button class="btn sm" data-act="tplEdit" data-id="${esc(t.id)}">編集</button></div></div>`}).join('')
    ||'<div class="empty">定型文がありません。「＋追加」で作れます。</div>'}`;
}
let TEDIT=null;
function openTpl(id){const t=id?S.templates.find(x=>x.id===id):null;
  TEDIT=t?{...t}:{id:uid(),category:UI.tcat!=='all'?UI.tcat:'コメント',title:'',body:'',fav:0,createdAt:Date.now(),updatedAt:Date.now(),_new:1};
  const cats=[...new Set([...TCATS,TEDIT.category])];
  openSheet(t?'定型文を編集':'定型文を追加',`<div class="fld"><label>名前</label><input id="tT" value="${esc(TEDIT.title)}" placeholder="例：発送完了の連絡"></div>
  <div class="fld"><label>種類</label><select id="tC">${cats.map(c=>`<option${c===TEDIT.category?' selected':''}>${esc(c)}</option>`).join('')}</select></div>
  <div class="fld"><label>本文</label><textarea id="tB">${esc(TEDIT.body)}</textarea></div>
  <div class="chips wrap">${VARS.map(v=>`<button class="chip" data-act="insVar" data-v="${v}">${v}</button>`).join('')}</div>
  <div class="note">変数をタップすると、本文のカーソル位置に入ります。{今日}はコピー時に今日の日付になります。ほかの変数（{価格}など）はコピーの前に入力欄が出ます。自分で {送料} のように新しい変数を書いても使えます。</div>
  <div class="btns" style="margin-top:16px"><button class="btn pri wide" data-act="tplSave">保存</button>${t?'<button class="btn dng" data-act="tplDel">削除</button>':''}</div>`)}
let FILL=null;
function tplCopy(id){const t=S.templates.find(x=>x.id===id);if(!t)return;
  const vs=varsOf(t.body);const base=t.body.replace(/\{今日\}/g,todayJ());
  if(!vs.length){copyText(base);return}
  FILL={id,vs};
  openSheet('入力してコピー',`<div class="note" style="margin-bottom:8px">「${esc(t.title)}」の変数を埋めてコピーします。空欄のままでもコピーできます（その部分は空になります）。</div>
  ${vs.map((v,i)=>`<div class="fld"><label>{${esc(v)}}</label><input data-fv="${i}" ${/価格|送料|金額|円/.test(v)?'inputmode="numeric"':''}></div>`).join('')}
  <div class="sec">プレビュー</div><div class="pv" id="fillPv">${esc(fillText(t.body,vs,[]))}</div>
  <div class="btns" style="margin-top:12px"><button class="btn pri wide" data-act="fillCopy">コピー</button></div>`);
  const f=document.querySelector('[data-fv="0"]');if(f)f.focus()}
function fillText(body,vs,vals){let s=body.replace(/\{今日\}/g,todayJ());
  vs.forEach((v,i)=>{let val=String(vals[i]??'').trim();if(v==='価格'&&val&&isFinite(num(val)))val=yen(num(val));s=s.split('{'+v+'}').join(val)});return s}
function fillVals(){return FILL.vs.map((_,i)=>{const e=document.querySelector(`[data-fv="${i}"]`);return e?e.value:''})}

/* ============================================================
   計算（販売価格・原価・配送料・手数料% → 利益・利益率）
   ============================================================ */
let C=null;
function calcReset(){const keep=C?{lp:C.lp,lv:C.lv}:{lp:'',lv:''};C={...keep,sale:'',cost:'',ship:String(S.settings.ship??''),fee:String(S.settings.feePct??10),res:null}}
calcReset();
function calcRun(){const sale=num(C.sale),cost=num(C.cost)||0,ship=num(C.ship)||0,fp=num(C.fee);
  if(!(sale>0)){toast('販売価格を入力してください');return}if(!isFinite(fp)){toast('手数料（%）を入力してください');return}
  const fee=Math.round(sale*fp/100);const profit=sale-cost-ship-fee;C.res={profit,rate:profit/sale*100,fee};render()}
// v2.0.2：1冊あたりの定価＝定価÷巻数（四捨五入）。利益計算とは独立・入力のたびに結果だけ更新
function perVolTxt(){const lp=num(C.lp),lv=num(C.lv);if(!isFinite(lp)||!isFinite(lv)||lv<=0||C.lp===''||C.lv==='')return '—';return yen(Math.round(lp/lv))}
function calcHTML(){const r=C.res;
  const row=(k,l,u,mode)=>`<label class="gr"><span class="lb">${l}</span><input data-c="${k}" inputmode="${mode||'numeric'}" value="${esc(C[k])}" placeholder="0" enterkeyhint="done"><span class="u">${u}</span></label>`;
  const srow=(k,l,u,mode)=>`<label class="gr"><span class="lb">${l}</span><input data-set="${k}" inputmode="${mode||'numeric'}" value="${esc(S.settings[k])}" enterkeyhint="done"><span class="u">${u}</span></label>`;
  return `<div class="gl">入力項目</div>
  <div class="gc">${row('sale','販売価格','円')}${row('cost','原価','円')}${row('ship','配送料','円')}${row('fee','手数料','%','decimal')}</div>
  <div class="gn">梱包費は配送料に含めて入力してください。</div>
  <div class="gc gbtns" style="margin-top:var(--sp3)"><button class="gb" data-act="calcRun">計算する</button><button class="gb" data-act="calcClear">クリア</button></div>
  <div class="gl">計算結果</div>
  <div class="gc"><div class="gr"><span class="lb">利益</span><span class="val ${r?(r.profit>=0?'pos':'neg'):''}" id="rP">${r?yen(r.profit):'—'}</span></div>
  <div class="gr"><span class="lb">利益率</span><span class="val" id="rR">${r?r.rate.toFixed(1)+'%':'—'}</span></div></div>
  <div class="gn" id="rF">${r?`販売手数料 ${yen(r.fee)} を差し引いています。`:'&nbsp;'}</div>
  <div class="gl">1冊あたりの定価</div>
  <div class="gc">${row('lp','定価（全巻合計）','円')}${row('lv','巻数','冊')}<div class="gr"><span class="lb">1冊あたり</span><span class="val" id="rU">${perVolTxt()}</span></div></div>
  <details class="gset"${UI.setOpen?' open':''} ontoggle="UI.setOpen=this.open"><summary>設定（計算の初期値）</summary>
  <div class="gc">${srow('feePct','手数料率の初期値','%','decimal')}${srow('ship','配送料の初期値','円')}</div>
  <div class="gn">「クリア」を押したときや、次にアプリを開いたときの初期値になります。</div>
  ${oldBackupHTML()}</details>`}
// 旧POSTAの出品メモ等は消していない。SSSへ移す前の念のため、旧データをそのまま書き出せるようにする。
function oldBackupHTML(){let has=false;try{has=!!localStorage.getItem(OLD_KEY)}catch(e){}
  if(!has)return '';
  return `<div class="gl">旧POSTAのデータ</div><div class="card" style="border-radius:20px;border:0"><div class="note" style="margin-bottom:8px">旧POSTA（v1）の出品メモなどはこの端末に残っています（この画面には出しません）。SSSに取り込むときは、ここから書き出したファイルを使えます。</div>
  <button class="btn" data-act="oldExport">旧POSTAのバックアップを書き出す</button></div>`}
function oldExport(){let t=null;try{t=localStorage.getItem(OLD_KEY)}catch(e){}if(!t){toast('旧POSTAのデータはありません');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=`posta_backup_${ymd(Date.now()).replace(/-/g,'')}.json`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('書き出しました（「ファイル」アプリに保存されます）')}

/* ---------- 描画・操作 ---------- */
function render(){$('#ver').textContent='v'+APP_VER;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  $('#view').innerHTML=UI.tab==='tpl'?tplHTML():calcHTML()}
const ACT={
  closeSheet(){closeSheet()},
  tChip(b){UI.tcat=b.dataset.v;render()},
  newTpl(){openTpl(null)},
  tplEdit(b){openTpl(b.dataset.id)},
  tplCopy(b){tplCopy(b.dataset.id)},
  tplFav(b){const t=S.templates.find(x=>x.id===b.dataset.id);if(!t)return;t.fav=t.fav?0:1;save();render();toast(t.fav?'★ 上に固定しました':'★ を外しました')},
  insVar(b){const ta=$('#tB');const s=ta.selectionStart??ta.value.length,e=ta.selectionEnd??s;ta.value=ta.value.slice(0,s)+b.dataset.v+ta.value.slice(e);ta.focus();const p=s+b.dataset.v.length;ta.setSelectionRange(p,p)},
  tplSave(){const title=$('#tT').value.trim(),body=$('#tB').value;if(!title&&!body.trim()){toast('名前か本文を入力してください');return}
    const isNew=TEDIT._new;delete TEDIT._new;Object.assign(TEDIT,{title:title||body.trim().slice(0,16),category:$('#tC').value,body,updatedAt:Date.now()});
    if(isNew)S.templates.push(TEDIT);else{const i=S.templates.findIndex(x=>x.id===TEDIT.id);if(i>=0)S.templates[i]=TEDIT}
    save();closeSheet();render();toast('保存しました')},
  tplDel(){if(!TEDIT||!confirm(`「${TEDIT.title}」を削除しますか？`))return;S.templates=S.templates.filter(x=>x.id!==TEDIT.id);save();closeSheet();render();toast('削除しました')},
  fillCopy(){if(!FILL)return;const t=S.templates.find(x=>x.id===FILL.id);if(!t)return;copyText(fillText(t.body,FILL.vs,fillVals()));closeSheet()},
  calcRun(){document.querySelectorAll('[data-c]').forEach(e=>C[e.dataset.c]=e.value);calcRun()},
  calcClear(){calcReset();render()},
  oldExport(){oldExport()},
};
document.addEventListener('click',e=>{
  const tb=e.target.closest('#tabs button');if(tb){UI.tab=tb.dataset.tab;render();$('#view').scrollTop=0;return}
  const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e)}});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='tq'){UI.tq=el.value;clearTimeout(UI.tqT);UI.tqT=setTimeout(()=>{const pos=el.selectionStart;render();const n=$('#tq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},250);return}
  if(el.dataset.c){C[el.dataset.c]=el.value;if(el.dataset.c==='lp'||el.dataset.c==='lv'){const u=$('#rU');if(u)u.textContent=perVolTxt()}return}
  if(el.dataset.fv!==undefined&&FILL){const t=S.templates.find(x=>x.id===FILL.id);const pv=$('#fillPv');if(t&&pv)pv.textContent=fillText(t.body,FILL.vs,fillVals())}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.set){const k=el.dataset.set;const n=num(el.value);if(!isFinite(n)||n<0||(k==='feePct'&&n>=100)){toast('数字で入力してください');el.value=S.settings[k];return}
    const ck=k==='feePct'?'fee':'ship';if(C&&!C.res&&String(C[ck])===String(S.settings[k])){C[ck]=String(n);const ci=document.querySelector(`[data-c=${ck}]`);if(ci)ci.value=C[ck]}
    S.settings[k]=n;el.value=n;save();toast('初期値を保存しました')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.c){e.preventDefault();e.target.blur();ACT.calcRun()}});
render();
</script>
</body>
</html>
