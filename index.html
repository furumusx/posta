<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fbfbfa">
<title>POST - 出品作業</title>
<style>
:root{--bg:#fbfbfa;--bg2:#ececea;--card:#fff;--line:#e7e7e2;--line2:#efefeb;--tx:#141414;--mut:#77776f;--mut2:#9a9a94;--acc:#2451e6;--accbg:#eef1fe;--pos:#0b7a55;--posbg:#e2f5ec;--neg:#b42323;--negbg:#fde8e8;--amb:#a86a08;--ambbg:#fdf0dc;--safe:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer;touch-action:manipulation;background:none;border:0}
button:disabled{cursor:not-allowed}
[hidden]{display:none!important}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 28px}
#tabs{flex:none;display:flex;background:#fff;border-top:1px solid #e6e6e1;padding:7px 10px calc(8px + var(--safe))}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut2);font-weight:600;white-space:nowrap}
#tabs button.on{color:var(--tx)}
#tabs svg{width:23px;height:23px}
.h-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
h2{font-size:24px;font-weight:800;letter-spacing:.01em}
.sub{font-size:12px;color:var(--mut)}
.mut{color:var(--mut)}
.nw{white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3.5px 8px;border-radius:999px;background:#f0f0ec;color:#55554f;white-space:nowrap}
.chip.blue{background:#e8eeff;color:var(--acc)}.chip.green{background:var(--posbg);color:var(--pos)}.chip.amber{background:var(--ambbg);color:var(--amb)}.chip.red{background:var(--negbg);color:var(--neg)}
button.chip{border:0}
.lnk{font-size:12.5px;font-weight:700;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin-top:10px}
.card.hold{border:2px solid rgba(180,35,35,.35);background:#fffafa}
.item{display:flex;gap:11px;align-items:flex-start}
.thumb{width:56px;height:56px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;text-align:center;line-height:1.35;padding:4px;overflow:hidden;position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.it-t{font-size:13.5px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.nums{display:flex;gap:12px;margin-top:6px;font-size:11px;color:var(--mut);flex-wrap:wrap}
.nums span{white-space:nowrap}
.nums b{color:var(--tx);font-size:12.5px}
.nums .prof b{color:var(--pos)}.nums .neg b{color:var(--neg)}
.qf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line2)}
.next{margin-left:auto;align-self:center;background:var(--tx);color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:9px 12px;white-space:nowrap;flex:none}
.next.light{background:var(--accbg);color:var(--acc)}
.next.red{background:var(--negbg);color:var(--neg)}
.selbox{width:22px;height:22px;flex:none;align-self:center;accent-color:var(--acc)}
.filters{display:flex;gap:7px;margin-top:13px;overflow-x:auto;flex:none;padding:2px 0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid #e3e3de;color:#55554f;white-space:nowrap;flex:none}
.fchip.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.fchip:disabled{opacity:.5}
.sum{display:flex;gap:8px;margin-top:14px}
.sumbox{flex:1;background:#fff;color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:12px 13px;text-align:left}
.sumbox.dark{background:var(--tx);color:#fff;border-color:var(--tx)}
.sumbox .n{font-size:20px;font-weight:800}
.sumbox .l{font-size:10.5px;opacity:.75;font-weight:600;margin-top:1px;white-space:nowrap}
.banner{background:var(--ambbg);color:#6b4500;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.banner.red{background:var(--negbg);color:var(--neg)}
.banner .grow{flex:1;min-width:0}
.banner button{font-weight:700;color:inherit;text-decoration:underline;white-space:nowrap}
.bulk{position:sticky;bottom:0;margin:12px -4px 0;background:var(--tx);color:#fff;border-radius:16px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.bulk button{background:#fff;color:var(--tx);border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.bulk button.gh{background:transparent;color:#fff;border:1px solid #555}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;font-weight:700;border:1px solid transparent;min-height:44px;padding:0 14px;font-size:14px;white-space:nowrap}
.btn-pri{background:var(--tx);color:#fff;width:100%;font-size:14.5px}
.btn-acc{background:var(--acc);color:#fff}
.btn-ghost{background:#fff;border-color:#dededa;color:var(--tx)}
.btn-dng{background:#fff;border-color:#f0caca;color:var(--neg)}
.btn.sm{min-height:34px;padding:0 10px;font-size:12px;border-radius:10px}
.btn.wide{flex:1}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.back{font-size:13px;color:var(--mut);padding:4px 0}
.dtitle{font-size:17px;font-weight:800;margin-top:8px;overflow-wrap:anywhere}
.photos{display:flex;gap:7px;margin-top:9px;overflow-x:auto;padding-bottom:2px}
.ph{width:64px;height:64px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-align:center;line-height:1.3;position:relative;overflow:hidden;background:#cfd3d6;cursor:pointer}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .lbl{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);font-size:8.5px;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph.vac{background:#fff;border:1.5px dashed #cfcfc9;color:var(--mut2)}
.ph.vac .tp{margin-top:-12px}
.ph.vac .lbl{background:#f0f0ec;color:#77776f}
.camin{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.field{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-top:9px}
.field .lb{font-size:10.5px;font-weight:700;color:var(--mut2);letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.field .lb .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.field .vl{font-size:13.5px;margin-top:5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.field .vl.long{max-height:13em;overflow:auto}
.field .vl.empty{color:var(--mut2)}
.field .cur{font-size:12.5px;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.old{color:#b3261e}.new{color:#23713a}
.cnt{font-weight:500;letter-spacing:0;white-space:nowrap}.cnt.over{color:var(--neg);font-weight:700}
.copybtn{font-size:11px;font-weight:700;color:var(--acc);background:var(--accbg);border-radius:8px;padding:6px 10px;white-space:nowrap;letter-spacing:0}
.copybtn.done{background:var(--posbg);color:var(--pos)}
.copybtn:disabled{background:#f0f0ec;color:var(--mut2)}
.ck{font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 9px;white-space:nowrap;letter-spacing:0;background:#fff}
.ck.on{background:var(--posbg);border-color:#bfe6d2;color:var(--pos)}
.ck:disabled{opacity:.5}
.edm{font-size:11px;color:var(--acc);margin-top:4px}
.ptabs{display:flex;gap:6px;margin-top:12px}
.ptabs button{flex:1;min-width:0;padding:8px 0;border-radius:10px;background:#efefeb;color:var(--mut);font-size:12px;font-weight:700;white-space:nowrap}
.ptabs button.on{background:var(--tx);color:#fff}
.ptabs button:disabled{opacity:.35}
.pg{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:10px}
.pgb{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}.pgb i{display:block;height:100%;background:var(--acc)}
.phl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.phl button{font-size:11.5px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;color:var(--mut)}
.phl button.on{background:var(--posbg);border-color:#bfe6d2;color:var(--pos)}
.pricepanel{background:var(--tx);color:#fff;border-radius:18px;padding:15px 16px;margin-top:12px}
.pricepanel .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;padding:3.5px 0;color:#c9c9c4}
.pricepanel .row span{white-space:nowrap}
.pricepanel .row b{color:#fff;font-size:13.5px;white-space:nowrap}
.pricepanel .row input{width:110px;text-align:right;font-weight:800;font-size:16px;background:#262626;border:1px solid #444;border-radius:8px;color:#fff;padding:5px 8px}
.pricepanel .big{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid #333;padding-top:9px;margin-top:6px}
.pricepanel .big .p{font-size:21px;font-weight:800;white-space:nowrap}
.pricepanel .big .pf{color:#4ade80;font-weight:800;font-size:14px;white-space:nowrap}
.pricepanel .pos{color:#4ade80!important}.pricepanel .neg{color:#ff8a8a!important}
.pricepanel .nx{font-size:12px;color:#ffd27a;margin-top:6px}
.pricepanel .warn{font-size:12px;color:#ff8a8a;margin-top:4px;font-weight:700}
.pricepanel .ck{background:transparent;color:#ddd;border-color:#555;margin-top:8px}
.pricepanel .ck.on{background:#1f3d2f;color:#4ade80;border-color:#2e6b4e}
.pricepanel .sm2{font-size:11px;color:#bbb}
.pricepanel button.rs{font-size:11px;color:#9db5ff;text-decoration:underline}
.secttl{font-size:12px;font-weight:800;letter-spacing:.05em;color:#55554f;margin:16px 0 2px;white-space:nowrap}
.cpdone{background:var(--posbg);border:1px solid #bfe6d2;border-radius:14px;padding:11px 13px;margin-top:12px;font-size:13px;overflow-wrap:anywhere}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-top:9px;font-size:12.5px}
.box.hold{border:2px solid rgba(180,35,35,.35);background:#fffafa}
.box.blue{background:#f3f6ff;border-color:#d5defc}
.lks{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
details.fold{margin-top:12px}
details.fold>summary{list-style:none;cursor:pointer;font-size:12.5px;color:#55554f;font-weight:600;display:flex;justify-content:space-between;white-space:nowrap}
details.fold.wrap>summary{white-space:normal;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"▸";color:var(--mut);flex:none}details.fold[open]>summary::after{content:"▾"}
textarea.memo{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff;margin-top:6px}
/* 撮影 */
.bigframe{display:block;position:relative;margin-top:10px;width:100%;aspect-ratio:4/3;max-height:330px;background:#1b1b1e;border-radius:22px;overflow:hidden;cursor:pointer;color:#fff}
.bigframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.bigframe .guide{position:absolute;inset:40px 30px;border:1.5px solid rgba(255,255,255,.75);border-radius:6px}
.bigframe .guide:before,.bigframe .guide:after{content:"";position:absolute;background:rgba(255,255,255,.3)}
.bigframe .guide:before{left:50%;top:0;bottom:0;width:1px}.bigframe .guide:after{top:50%;left:0;right:0;height:1px}
.bigframe .tap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-weight:800;font-size:15px;letter-spacing:.06em;padding:0 40px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.bigframe .tap small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:6px;letter-spacing:0;line-height:1.5}
.bigframe .ov{position:absolute;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:700;padding:3.5px 8px;border-radius:999px}
.cuts{display:flex;gap:7px;margin-top:11px;overflow-x:auto;padding-bottom:2px}
.cut{flex:1 0 50px;text-align:center;font-size:10px;font-weight:700;color:var(--mut);line-height:1.3}
.cut .bx{height:44px;border-radius:10px;background:var(--bg2);border:1px solid #e0e0db;display:flex;align-items:center;justify-content:center;font-size:15px;color:#b9b9b3;margin-bottom:4px}
.cut.done .bx{background:var(--posbg);border-color:#bfe6d2;color:var(--pos)}
.cut.now .bx{background:#e8eeff;border-color:#b9c8ff;color:var(--acc)}
.cut.now{color:var(--acc)}
.flag{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;margin-top:8px}
.flag>*{min-width:0}
.flag>span{font-size:12px;color:var(--mut);white-space:nowrap}
.seg{display:flex;min-width:0;background:#efefeb;border-radius:12px;padding:3px}
.seg button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:12px;font-weight:700;padding:7px 0;border-radius:9px;color:var(--mut);white-space:nowrap}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.flag input.memo1{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;height:38px;padding:0 8px;background:#fff}
.tog{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:8px}
.tog input{width:20px;height:20px;accent-color:var(--acc)}
.shotrow{display:grid;grid-template-columns:72px 1fr;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}
.shotrow .ph{width:72px;height:72px}
.shotrow .lb{font-weight:700;font-size:13px}
.shotrow .gd{font-size:11px;color:var(--mut);margin:2px 0 6px}
.bdg{display:inline-block;font-size:10px;border-radius:6px;padding:0 6px;border:1px solid var(--line);color:var(--mut);margin-left:4px;font-weight:600}
.bdg.req{color:var(--amb);border-color:#f0d39c}.bdg.ok{color:var(--pos);border-color:#bfe6d2}.bdg.cover{background:var(--acc);border-color:var(--acc);color:#fff}
.model{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);margin-bottom:6px;cursor:pointer}
.model img{width:32px;height:32px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
/* 定型文 */
.srch{display:flex;gap:8px;margin-top:12px}
.srch input{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;height:42px;padding:0 12px}
.tpl{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-top:9px}
.tpl .ic{width:38px;height:38px;border-radius:11px;background:#f0f0ec;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.tpl .bd{flex:1;min-width:0;cursor:pointer}
.tpl .t{font-size:13.5px;font-weight:700;overflow-wrap:anywhere}
.tpl .d{font-size:11px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl .hint{font-size:10.5px;color:var(--acc);margin-top:2px}
.tpl .side{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex:none}
.star{font-size:17px;color:#c6c6c0;line-height:1;padding:2px 4px}
.star.on{color:#e0a100}
.empty{text-align:center;color:var(--mut);padding:30px 10px;font-size:13px}
/* 計算（1画面） */
.cgrp{background:#fff;border:1px solid var(--line);border-radius:18px;padding:2px 14px;margin-top:5px}
.cr{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:37px;border-bottom:1px solid var(--line2)}
.cr:last-child{border-bottom:0}
.cr .lb{font-size:13px;white-space:nowrap;flex:none}
.cr input{flex:1;min-width:0;width:100%;border:0;background:transparent;outline:none;text-align:right;font-weight:700;font-size:16px;padding:0;height:34px;font-variant-numeric:tabular-nums}
.cr input::placeholder{color:#c6c6c0;font-weight:600}
.cr .u{font-size:11px;color:var(--mut2);font-weight:600;flex:none;min-width:1.2em;text-align:right;white-space:nowrap}
.cr .val{flex:1;text-align:right;font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cr .val.acc{color:var(--acc)}.cr .val.pos{color:var(--pos)}.cr .val.neg{color:var(--neg)}
.cbtns{display:flex;gap:8px;margin-top:7px}
.cbtns .btn{flex:1;min-height:40px;font-size:13.5px}
.cnote{font-size:11px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#calcv .secttl{margin-top:10px}
#calcv details.fold{margin-top:9px}
@media (max-height:760px){#calcv .cr{min-height:32px}#calcv .cr input{height:30px}#calcv .secttl{margin-top:7px}#calcv .cbtns .btn{min-height:36px}#calcv h2{font-size:21px}#calcv details.fold{margin-top:7px}}
@media (max-height:680px){#calcv .cr{min-height:29px}#calcv .cr input{height:27px;font-size:15px}#calcv .cr .lb{font-size:12.5px}#calcv .secttl{margin-top:5px;font-size:11px}#calcv .cbtns .btn{min-height:33px}#calcv .cnote{margin-top:2px}main#view.calc{padding-top:calc(env(safe-area-inset-top,0px) + 8px)}}
/* シート */
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#sheet .sh{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;border-bottom:1px solid var(--line);background:#fff}
#sheet .sh h3{font-size:16px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .sb{flex:1;overflow:auto;padding:12px 16px calc(40px + var(--safe))}
.fld{margin-top:10px}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;height:44px;padding:0 10px}
.fld textarea{height:auto;min-height:180px;padding:10px;line-height:1.6}
.pv{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--acc)}
.meter.warn i{background:var(--neg)}
.imgpv{position:relative;display:block;margin:0 auto 10px;max-width:100%;width:fit-content}
.imgpv img{display:block;max-width:100%;max-height:50vh;border-radius:8px}
.imgpv svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cropbox{position:relative;width:min(320px,100%);aspect-ratio:1/1;margin:0 auto;overflow:hidden;border-radius:8px;background:#000;touch-action:none;outline:2px solid #ffe100}
.cropbox img{position:absolute;max-width:none;user-select:none;-webkit-user-select:none;pointer-events:none}
.cropbox svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cropbox svg line{stroke:#fff;stroke-opacity:.7;stroke-width:1}.cropbox svg line.c{stroke:#5aa9ff;stroke-dasharray:6}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp img{width:100%;border-radius:8px}
.mk{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border:3px solid #ffe100;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.6);pointer-events:none}
.blst{margin:0 0 8px;font-size:12px;color:var(--acc)}
.blst .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:4px}

function num(v){if(v===null||v===undefined||v==='')return NaN;if(typeof v==='number')return v;const t=String(v).normalize('NFKC').replace(/[,¥￥円%％\s]/g,'');if(t==='')return NaN;const n=Number(t);return isFinite(n)?n:NaN}

const ymd8=t=>ymd(t).replace(/-/g,'');

function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

async function shareOrDownload(blob,name,type){const f=new File([blob],name,{type});
  if(navigator.canShare&&navigator.share){try{if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return 'share'}}catch(e){if(e&&e.name==='AbortError')return 'abort'}}
  downloadBlob(blob,name);return 'download'}

let DBP=null;
function db(){if(DBP)return DBP;DBP=new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'k'});if(!d.objectStoreNames.contains('imgs'))d.createObjectStore('imgs',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return DBP}
async function tx(store,mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const st=t.objectStore(store);let out;const r=fn(st);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const idbGet=id=>tx('imgs','readonly',st=>st.get(id));
const idbPut=rec=>tx('imgs','readwrite',st=>st.put(rec));
const idbDel=id=>tx('imgs','readwrite',st=>st.delete(id));
const idbAll=()=>tx('imgs','readonly',st=>st.getAll());
const idbKeys=()=>tx('imgs','readonly',st=>st.getAllKeys());
const idbClear=()=>tx('imgs','readwrite',st=>st.clear());
const metaGet=k=>tx('meta','readonly',st=>st.get(k));
const metaPut=(k,v)=>tx('meta','readwrite',st=>st.put({k,v}));

let S=null;
function defState(){const n=new Date().toISOString();return{schema:1,app:APP_NAME,createdAt:n,templates:presets(),settings:defSettings(),
  cp:{importedVer:0,lastImport:null,settings:cpDefSettings()},items:[],results:[],models:{},backup:{lastAt:null,dirty:0,installedAt:n},migrated:{},persist:null}}
function fixState(s){const d=defState();if(!s||typeof s!=='object')return d;
  s.templates=Array.isArray(s.templates)?s.templates.map(normTpl).filter(Boolean):presets();
  s.settings=Object.assign(defSettings(),s.settings||{});
  if(!s.cp||typeof s.cp!=='object')s.cp=d.cp;s.cp.importedVer=Number.isFinite(s.cp.importedVer)?s.cp.importedVer:0;
  const cd=cpDefSettings();if(!s.cp.settings||typeof s.cp.settings!=='object')s.cp.settings={};for(const k of Object.keys(cd)){const o=Object.assign({},cd[k],s.cp.settings[k]||{});for(const p of PLATS){const n=num(o[p]);o[p]=isFinite(n)&&n>=0?n:cd[k][p]}s.cp.settings[k]=o}
  for(const [k,v] of Object.entries(defSettings())){if(typeof v==='number'){const n=num(s.settings[k]);s.settings[k]=isFinite(n)&&n>=0?n:v}else s.settings[k]=!!s.settings[k]}
  s.items=Array.isArray(s.items)?s.items.filter(x=>x&&typeof x==='object'&&x.id).map(fixItem):[];
  s.results=Array.isArray(s.results)?s.results.filter(r=>r&&r.resultId):[];
  if(!s.models||typeof s.models!=='object')s.models={};
  s.backup=Object.assign({lastAt:null,dirty:0,installedAt:d.backup.installedAt},s.backup||{});
  if(!s.migrated||typeof s.migrated!=='object')s.migrated={};s.schema=1;return s}
let saveT=null,savePend=null;
// 保存の唯一の入口。dirty=true のときは「未バックアップの変更」に数える
function save(dirty=true){if(!S)return;if(dirty)S.backup.dirty=(S.backup.dirty||0)+1;clearTimeout(saveT);
  if(!savePend){let r0;savePend=new Promise(r=>{r0=r});savePend._r=r0}const p=savePend;saveT=setTimeout(()=>saveNow(),120);return p}
async function saveNow(){clearTimeout(saveT);const p=savePend;savePend=null;let ok=true;
  try{await metaPut('S',S)}catch(e){ok=false;toast('保存できませんでした（端末の保存容量不足の可能性）')}
  if(p&&p._r)p._r(ok);return ok}
addEventListener('pagehide',()=>{if(savePend)saveNow()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&savePend)saveNow()});

function todayJ(){const d=new Date();return `${d.getMonth()+1}月${d.getDate()}日`}
function varsOf(body){const out=[];String(body).replace(/\{([^{}\n]{1,20})\}/g,(m,n)=>{if(n!=='今日'&&!out.includes(n))out.push(n);return m});return out}

/* ============================================================
   計算（POSTA v2.1.1 の計算式・初期値をそのまま移植。1画面に収める）
   ============================================================ */
let C=null;
function calcNew(keep){return Object.assign({lp:'',lv:'',lr:'30',rc:'',rs:String(S.settings.ship??''),rf:String(S.settings.feePct??10),rr:''},keep||{},{sale:'',cost:'',ship:String(S.settings.ship??''),fee:String(S.settings.feePct??10),res:null})}
function calcReset(){const keep=C?{lp:C.lp,lv:C.lv,lr:C.lr,rc:C.rc,rs:C.rs,rf:C.rf,rr:C.rr}:null;C=calcNew(keep)}
function calcRun(){const sale=num(C.sale),cost=num(C.cost)||0,ship=num(C.ship)||0,fp=num(C.fee);
  if(!(sale>0)){toast('販売価格を入力してください');return}if(!isFinite(fp)){toast('手数料（%）を入力してください');return}
  const fee=Math.round(sale*fp/100);const profit=sale-cost-ship-fee;C.res={profit,rate:profit/sale*100,fee};calcPaint()}
function calcPaint(){const r=C.res,p=$('#rP'),q=$('#rR'),f=$('#rF');
  if(p){p.textContent=r?yen(r.profit):'—';p.className='val '+(r?(r.profit>=0?'pos':'neg'):'')}if(q)q.textContent=r?r.rate.toFixed(1)+'%':'—';
  if(f)f.innerHTML=r?`販売手数料 ${esc(yen(r.fee))} を差し引いています。`:'梱包費は配送料に含めて入力してください。'}
// 1冊あたりの定価＝定価÷巻数（四捨五入）
function perVolTxt(){const lp=num(C.lp),lv=num(C.lv);if(!isFinite(lp)||!isFinite(lv)||lv<=0||C.lp===''||C.lv==='')return '—';return yen(Math.round(lp/lv))}
// 上限の目安＝floor((定価÷巻数)×掛け率÷100)。途中で丸めず最後に切り捨て
function capTxt(){const lp=num(C.lp),lv=num(C.lv),lr=num(C.lr);if(!(lp>0)||!(lv>0)||!(lr>0))return '—';return yen(Math.floor(lp*lr/(lv*100)))}
// 出品価格の逆算：ceil((原価＋配送料)÷(1−手数料%−目標利益率%))
function needCalc(){const c=num(C.rc),s=num(C.rs),f=num(C.rf),r=num(C.rr);
  if(![c,s,f,r].every(isFinite)||c<0||s<0||f<0)return null;const den=100-f-r;if(!(den>0))return null;
  const need=Math.ceil((c+s)*100/den-1e-9);return{need,profit:need-need*f/100-c-s}}
function needHTML(){const n=needCalc();return{need:n?yen(n.need):'—',profit:n?yen(n.profit):'—',cls:n?(n.profit>=0?'pos':'neg'):''}}
function needUpdate(){const n=needHTML(),a=$('#rNeed'),b=$('#rNeedP');if(a)a.textContent=n.need;if(b){b.textContent=n.profit;b.className='val '+n.cls}}
function calcHTML(inSheet){const r=C.res,nh=needHTML();
  const row=(k,l,u,mode)=>`<label class="cr"><span class="lb">${l}</span><input data-c="${k}" inputmode="${mode||'numeric'}" value="${esc(C[k])}" placeholder="0" enterkeyhint="done"><span class="u">${u}</span></label>`;
  const srow=(k,l,u,mode)=>`<label class="cr"><span class="lb">${l}</span><input data-set="${k}" inputmode="${mode||'numeric'}" value="${esc(S.settings[k])}" enterkeyhint="done"><span class="u">${u}</span></label>`;
  return `<div id="calcv">${inSheet?'':`<div class="h-row"><h2>計算</h2><span class="chip">一画面に集約</span></div>`}
  <div class="secttl">入力項目</div>
  <div class="cgrp">${row('sale','販売価格','円')}${row('cost','原価','円')}${row('ship','配送料','円')}${row('fee','手数料','%','decimal')}</div>
  <div class="cbtns"><button class="btn btn-acc" data-act="calcRun">計算する</button><button class="btn btn-ghost" data-act="calcClear">クリア</button></div>
  <div class="secttl">計算結果</div>
  <div class="cgrp"><div class="cr"><span class="lb">利益</span><span class="val ${r?(r.profit>=0?'pos':'neg'):''}" id="rP">${r?yen(r.profit):'—'}</span></div>
  <div class="cr"><span class="lb">利益率</span><span class="val" id="rR">${r?r.rate.toFixed(1)+'%':'—'}</span></div></div>
  <div class="cnote" id="rF">${r?`販売手数料 ${esc(yen(r.fee))} を差し引いています。`:'梱包費は配送料に含めて入力してください。'}</div>
  <div class="secttl">1冊あたりの定価</div>
  <div class="cgrp">${row('lp','定価（全巻合計）','円')}${row('lv','巻数','冊')}${row('lr','掛け率','%','decimal')}<div class="cr"><span class="lb">1冊あたり</span><span class="val acc" id="rU">${perVolTxt()}</span></div><div class="cr"><span class="lb">上限の目安</span><span class="val acc" id="rCap">${capTxt()}</span></div></div>
  <details class="fold"${UI.revOpen?' open':''} data-fold="revOpen"><summary>出品価格の逆算（目標利益率から）</summary>
  <div class="cgrp">${row('rc','原価','円')}${row('rs','配送料','円')}${row('rf','手数料','%','decimal')}${row('rr','目標利益率','%','decimal')}
  <div class="cr"><span class="lb">必要出品価格</span><span class="val" id="rNeed">${nh.need}</span></div>
  <div class="cr"><span class="lb">その価格での利益</span><span class="val ${nh.cls}" id="rNeedP">${nh.profit}</span></div></div></details>
  <details class="fold"${UI.setOpen?' open':''} data-fold="setOpen"><summary>設定（計算の初期値）</summary>
  <div class="cgrp">${srow('feePct','手数料率の初期値','%','decimal')}${srow('ship','配送料の初期値','円')}</div>
  <div class="cnote">「クリア」を押したときや、次にアプリを開いたときの初期値になります。</div></details></div>`}

/* ============================================================
   カード（コピペ出品：POSTA v2.1.1 の取り込み・版数ゲート・コピー仕様をそのまま移植）
   出品キューの1件＝1アイテム。カード由来のアイテムは id＝カードID
   ============================================================ */
const PLATS=['mercari','yahooflea','rakuma'];
const PLAT_J={mercari:'メルカリ',yahooflea:'ヤフーフリマ',rakuma:'ラクマ'};
const KINDS=['fix','draft','pricecut'];
const KIND_CARD={fix:'修正カード',draft:'新規下書き',pricecut:'値下げカード'};
const DONE_J={fix:'修正済み',draft:'出品済み',pricecut:'値下げ済み'};
const CP_MAX_FILE=1024*1024;
const CARD_KEYS=['kind','platform','itemRef','work','sub','currentPrice','holdReason','holdDetail','fields','photos','price','links','thumb','per','sssId'];
function cpDefSettings(){return{fee:{mercari:10,yahooflea:5,rakuma:10},titleMax:{mercari:40,yahooflea:65,rakuma:80},descMax:{mercari:1000,yahooflea:1000,rakuma:1000}}}
const cpS=(v,max=5000)=>v==null?'':String(v).slice(0,max);
const cpN=v=>{const n=num(v);return isFinite(n)?n:null};
const cpDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))?String(v):'';
function cpNormFields(a){if(!Array.isArray(a))return null;const out=[],seen={};
  for(const f of a.slice(0,40)){if(!f||typeof f!=='object')continue;
    const label=cpS(f.label,40).trim();if(!label)continue;seen[label]=(seen[label]||0)+1;
    const o={key:seen[label]>1?label+'#'+seen[label]:label,type:f.type==='select'?'select':'copy',label,value:cpS(f.value)};
    if(f.currentValue!=null&&f.currentValue!=='')o.currentValue=cpS(f.currentValue);
    if(f.badge)o.badge=cpS(f.badge,30);if(f.role==='title'||f.role==='desc')o.role=f.role;out.push(o)}
  return out}
// v1.0.0：調査日（marketDate）・回転（turnover＝月あたり売り切れ件数）・出品日（listedAt）も受け取る
function cpNormPrice(p){if(!p||typeof p!=='object')return null;const o={};

// 書き出さないもの：取り消し（cancelled＝POST 内の帳消し。取り消された元の結果も送らない）・SSS アイテムIDの無い結果・必須項目を満たせない売却
const SSS_RID_RE=/^[A-Za-z0-9_.:\-]{1,80}$/;
const sssYen=v=>{const n=typeof v==='number'?v:(typeof v==='string'&&v.trim()!==''?Number(v):NaN);return isFinite(n)&&n>0&&n<1e8?Math.round(n):null};
const sssCh=v=>typeof v==='string'&&v.trim()?v.trim().slice(0,30):null;
const sssDate=v=>{const t=String(v??'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(t))return ymd(t+'T00:00:00')===t?t:null;const d=t?new Date(t):null;return d&&!isNaN(d)?ymd(d):null};
const sssUrl=v=>{const t=String(v??'').trim();return t.length<=500&&/^https?:\/\/[^\s"'<>\\]+$/i.test(t)?t:null};   // SSS の vUrl と同じ条件（外れると SSS が結果ごと捨てるので url だけ落とす）
function resultToSss(r,voided){if(!r||!r.resultId||r.kind==='cancelled')return null;if((voided||sssVoided()).has(r.resultId))return null;const sssId=String(r.sssItemId||'').trim();
  if(!sssId||!SSS_RID_RE.test(String(r.resultId)))return null;
  const pick=o=>{const x={};for(const k of Object.keys(o))if(o[k]!=null&&o[k]!=='')x[k]=o[k];return x};
  const base={resultId:String(r.resultId),sssId};
  if(r.kind==='sold'){const sold=pick({ch:sssCh(r.platform),price:sssYen(r.soldPrice),date:sssDate(r.soldAt),fee:r.fee!=null?Math.round(Number(r.fee)):null,ship:r.ship!=null?Math.round(Number(r.ship)):null});
    if(!sold.ch||sold.price==null||!sold.date)return null;if(!(sold.fee>=0))delete sold.fee;if(!(sold.ship>=0))delete sold.ship;return Object.assign(base,{sold})}
  if(r.kind==='deal')return Object.assign(base,{status:'deal',listing:pick({price:sssYen(r.listPrice)})});
  const url=sssUrl(r.url);const id=r.listingId?String(r.listingId).trim().slice(0,100):null;const cond=r.condition?String(r.condition).trim().slice(0,60):null;
  if(r.kind==='listed')return Object.assign(base,{listing:pick({ch:sssCh(r.platform),price:sssYen(r.listPrice),date:sssDate(r.at),url,id,cond})});
  // 手直し：出品日は変えない（元の出品日と食い違うため送らない）
  if(r.kind==='fixed')return Object.assign(base,{listing:pick({ch:sssCh(r.platform),price:sssYen(r.listPrice),url,id,cond})});
  // 値下げ：価格改定の事実だけ
  if(r.kind==='priceCut'){const price=sssYen(r.listPrice);if(price==null)return null;return Object.assign(base,{listing:pick({ch:sssCh(r.platform),price})})}
  return null}
const sssVoided=()=>new Set(S.results.filter(r=>r&&r.kind==='cancelled'&&r.cancels).map(r=>r.cancels));
const sssExportable=()=>{const v=sssVoided();return S.results.filter(r=>resultToSss(r,v))};
function resultsJSON(){const results=[],v=sssVoided();for(const r of S.results){const x=resultToSss(r,v);if(x)results.push(x)}
  return{format:'sss-results',formatVer:1,app:APP_NAME,appVer:APP_VER,exportedAt:new Date().toISOString(),results}}
async function exportResults(){const out=resultsJSON();if(!out.results.length){toast('SSS へ書き出せる結果はまだありません');return null}const now=new Date().toISOString();
  const sent=new Set(out.results.map(x=>x.resultId));
  const r=await shareOrDownload(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),`${APP_NAME}_results_${ymd8(Date.now())}.json`,'application/json');
  if(r!=='abort'){S.results.forEach(x=>{if(!x.exportedAt&&sent.has(x.resultId))x.exportedAt=now});save(false);toast(`結果 ${out.results.length}件を書き出しました`)}return out}

/* ---------- 出品完了・売却・値下げ ---------- */
function finishPlat(it,p,ref){const s=cpSt(it,p);const at=new Date().toISOString();s.done={at,ref:String(ref||'').trim().slice(0,500)};const rp=refParts(s.done.ref);
  if(it.kind==='draft')addResult(it,'listed',{platform:p,listPrice:cpPrice(it,p),url:rp.url,listingId:rp.listingId,at});
  else if(it.kind==='fix')addResult(it,'fixed',{platform:p,listPrice:it.currentPrice,url:rp.url,listingId:rp.listingId,at});
  else addResult(it,'priceCut',{platform:p,prevPrice:it.currentPrice,listPrice:cpPrice(it,p),at});
  if(it.platform.every(x=>cpSt(it,x).done)){it.doneAt=at;
    if(it.kind==='draft'){it.listed=true;it.listedAt=at;it.listPrice=cpPrice(it,it.platform[0]);it.currentPrice=it.listPrice;reserveShrink(it,at)}
    if(it.kind==='pricecut'){it.currentPrice=cpPrice(it,it.platform[0]);it.lastCutAt=at}
    it.updatedAt=Date.now();save();return true}
  it.updatedAt=Date.now();save();return false}
async function recordSold(it,o){it.soldAt=o.date;it.soldPrice=o.price;it.soldPlatform=o.platform;it.updatedAt=Date.now();
  if(!it.shrink&&!it.thumbOnly)reserveShrink(it);
  addResult(it,'sold',{platform:o.platform,soldPrice:o.price,soldAt:o.date,listPrice:it.currentPrice??it.listPrice??null});
  if(shrinkPending(it))await shrinkItem(it,'sold');save()}
function recordCut(it,price){const prev=it.currentPrice;it.currentPrice=price;it.lastCutAt=new Date().toISOString();
  if(it.price&&it.price.nextCut)it.price.nextCut=Object.assign({},it.price.nextCut,{doneAt:ymd(Date.now())});
  addResult(it,'priceCut',{platform:it.soldPlatform||it.platform[0],prevPrice:prev,listPrice:price});it.updatedAt=Date.now();save()}
function markListedBulk(it){const at=new Date().toISOString();
  if(it.kind==='draft'&&!it.doneAt){for(const p of it.platform)if(!cpSt(it,p).done){cpSt(it,p).done={at,ref:''};addResult(it,'listed',{platform:p,listPrice:cpPrice(it,p),url:null,listingId:null,at})}
    it.doneAt=at;it.listed=true;it.listedAt=at;it.listPrice=cpPrice(it,it.platform[0]);it.currentPrice=it.listPrice;reserveShrink(it,at);it.updatedAt=Date.now();return true}
  return false}

/* ---------- データ（容量・バックアップ・取り込み・書き出し） ---------- */
async function capacity(){const o={usage:null,quota:null,pct:0,photos:0,photoCnt:0,itemsWithPhotos:0};
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();o.usage=e.usage;o.quota=e.quota}}catch(_){}
  try{const items=new Set();for(const r of await idbAll()){const b=srcOf(r);if(b){o.photos+=b.size;if(r.kind!=='mask'&&r.kind!=='model'){o.photoCnt++;if(r.item)items.add(r.item)}}}o.itemsWithPhotos=items.size}catch(_){}
  if(o.usage!=null&&o.quota)o.pct=o.usage/o.quota*100;
  const per=o.itemsWithPhotos?Math.max(50*1024,o.photos/o.itemsWithPhotos):7*SAVE_TARGET;o.perItem=per;
  o.left=o.quota?Math.max(0,Math.floor((o.quota*0.7-(o.usage||0))/per)):null;   // 70%（警告ライン）に届くまでの商品数
  UI.cap=o;return o}
function capHTML(o){if(!o)return '<div class="sub">計算中…</div>';
  return `<div class="h-row"><b>${o.usage!=null?fmtMB(o.usage):'—'} / ${o.quota?fmtMB(o.quota):'—'}</b><b style="color:${o.pct>=70?'var(--neg)':'inherit'}">${o.pct.toFixed(1)}%</b></div>
  <div class="meter${o.pct>=70?' warn':''}"><i style="width:${Math.min(100,o.pct).toFixed(1)}%"></i></div>
  <div class="sub" style="margin-top:6px">写真データ ${fmtMB(o.photos)}（${o.photoCnt}枚）／ 1商品あたり約${(o.perItem/1024).toFixed(0)}KB で計算すると、<b>あと約${o.left!=null?o.left.toLocaleString('ja-JP'):'—'}商品分</b>（使用率70%まで）</div>
  ${o.pct>=70?'<div class="sub" style="color:var(--neg);font-weight:700;margin-top:4px">⚠ 使用率が70%を超えています。バックアップを書き出してください。</div>':''}`}

async function importPhoto(it,i,file){const s=it.shots[i];if(!s)return;toast('保存中…');
  let blob;try{blob=await compress(file)}catch(e){toast('画像を読み込めませんでした');return}
  if(s.imgId){await idbDel(s.imgId).catch(()=>{});dropURL(s.imgId);if(hasBlur(s.edit))idbDel(s.edit.blur.mask).catch(()=>{})}
  const id='p_'+uid();await idbPut({id,orig:blob,at:Date.now(),item:it.id,kind:'photo'});s.imgId=id;s.base={square:true,crop:{x:0,y:0,scale:1}};s.edit=JSON.parse(JSON.stringify(s.base));
  if(it.thumbOnly&&!s.thumb){it.thumbOnly=false}
  finalize(it);save();UI.prepared=null;ONE=null;
  // 次の未撮影の枠へ進める（撮影画面のとき）
  if(UI.view==='shoot'){const nx=it.shots.findIndex((x,j)=>j>i&&!x.imgId);UI.cut=nx>=0?nx:i}
  else if(UI.view==='detail'){UI.cut=i;UI.view='shoot'}
  rerender();toast(`保存しました（${Math.round(blob.size/1024)}KB）${it.shotStatus==='撮影完了'?'・必須カットがそろいました':''}`);
  if(S.settings.autoBlur)autoBlur(it,s)}
async function autoBlur(it,s){let seg;try{seg=await loadSeg()}catch(e){toast('背景ぼかしはネット接続時に使えます（写真はぼかしなしで保存済み）');return}
  try{const r=await idbGet(s.imgId);const src=srcOf(r);if(!src)return;const res=await makeMask(seg,src,0.5,0.5);if(res.ratio<0.005||res.ratio>0.97){toast('中央の商品をうまく切り出せませんでした（編集から指定できます）');return}
    const id='k_'+uid();await idbPut({id,orig:res.blob,at:Date.now(),item:it.id,kind:'mask'});s.edit=Object.assign({},s.edit||{},{blur:{mask:id,x:0.5,y:0.5,lvl:'m'}});dropURL(s.imgId);save();rerender();toast('背景ぼかし（中）を適用しました')}
  catch(e){toast('背景ぼかしでエラーが起きました（写真はそのまま保存済み）')}}

  <line x1="${w/2}" y1="0" x2="${w/2}" y2="${h}" stroke="#5aa9ff" stroke-dasharray="${w/60}" stroke-width="${w/300}"/><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#5aa9ff" stroke-dasharray="${w/60}" stroke-width="${w/300}"/>

async function openEdit(i){const it=curItem();const s=it&&it.shots[i];if(!s||!s.imgId)return;const ed=s.edit||{};

function cropGrid(){const b=$('#cropBox');if(!b)return;const o=b.querySelector('svg');if(o)o.remove();if(!UI.grid)return;

function placeCrop(){const b=$('#cropBox'),im=$('#cropImg');if(!b||!im||!EDI)return;const box=b.clientWidth;const {sx,sy,side}=cropRect(EDI.w,EDI.h,EDI.crop);const k=box/side;

function setCropCenter(cx,cy){const {side}=cropRect(EDI.w,EDI.h,EDI.crop);const fx=EDI.w>side?(clamp(cx,side/2,EDI.w-side/2)-EDI.w/2)/((EDI.w-side)/2):0;const fy=EDI.h>side?(clamp(cy,side/2,EDI.h-side/2)-EDI.h/2)/((EDI.h-side)/2):0;EDI.crop.x=fx;EDI.crop.y=fy}
let cropT=null;
function commitCrop(){clearTimeout(cropT);cropT=setTimeout(async()=>{const it=getI(EDI.id);const s=it&&it.shots[EDI.i];if(!s)return;
  s.edit=Object.assign({},s.edit||{},{crop:{x:+EDI.crop.x.toFixed(4),y:+EDI.crop.y.toFixed(4),scale:+(+EDI.crop.scale).toFixed(3)}});dropURL(s.imgId);it.updatedAt=Date.now();UI.prepared=null;ONE=null;save();const bx=$('#oneBox');if(bx)bx.innerHTML=oneBtnHTML(it,EDI.i);
  const u=await shotURL(s.imgId,s.edit,1200);const e=$('#edImg');if(e&&u)e.src=u;rerender()},250)}
function wireCrop(){const b=$('#cropBox'),im=$('#cropImg');if(!b)return;const go=()=>{placeCrop();cropGrid()};if(im.complete&&im.naturalWidth)go();else im.onload=go;
  let st=null;b.addEventListener('pointerdown',e=>{const {sx,sy,side}=cropRect(EDI.w,EDI.h,EDI.crop);st={x:e.clientX,y:e.clientY,cx:sx+side/2,cy:sy+side/2,k:b.clientWidth/side};try{b.setPointerCapture(e.pointerId)}catch(_){}});
  b.addEventListener('pointermove',e=>{if(!st)return;setCropCenter(st.cx-(e.clientX-st.x)/st.k,st.cy-(e.clientY-st.y)/st.k);placeCrop()});
  const end=()=>{if(st){st=null;commitCrop()}};b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);
  const z=$('#cropZ');z.addEventListener('input',()=>{EDI.crop.scale=+z.value;placeCrop()});z.addEventListener('change',()=>commitCrop())}

  const r=await idbGet(s.imgId).catch(()=>null);const src=srcOf(r);if(!src){toast('写真データがありません');return}
  const ed=s.edit||{};const b=hasBlur(ed)?ed.blur:null;blEnd();
  BL={tok:uid(),i:EDI.i,src,rot:ed.rot||0,x:b&&b.x!=null?b.x:null,y:b&&b.y!=null?b.y:null,mask:b?b.mask:null,applied:b?b.mask:null,lvl:b&&BLUR_LV[b.lvl]?b.lvl:'m',busy:false,url:null,seq:0};

  <div class="imgpv" id="blBox"><img id="blImg" data-act="blTap" src="" alt="" style="cursor:crosshair"><div id="blMk" class="mk" hidden></div></div>
  <div id="blSt" class="blst" hidden><div class="bar"><i></i></div><span id="blStT"></span></div>

async function blPreview(){if(!BL)return;const B=BL,seq=++B.seq;const ed={rot:B.rot};if(B.mask)ed.blur={mask:B.mask,lvl:B.lvl};
  let b=null;try{b=await renderEdit(B.src,ed,1200)}catch(e){}if(BL!==B||B.seq!==seq||!b)return;

function blMark(){const mk=$('#blMk');if(!mk||!BL)return;if(BL.x==null){mk.hidden=true;return}const [x,y]=rotPt(BL.x,BL.y,BL.rot);mk.style.left=x*100+'%';mk.style.top=y*100+'%';mk.hidden=false}

  catch(err){if(BL===B){blStatus('');toast('背景ぼかしでエラーが起きました（編集内容はそのままです）')}}

const b2d=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});

async function d2b(u){const m=/^data:([^;,]*)(;base64)?,(.*)$/s.exec(String(u||''));if(!m||!/^image\/(jpeg|png)$/.test(m[1]))return null;const bin=m[2]?atob(m[3]):decodeURIComponent(m[3]);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m[1]||'application/octet-stream'})}

  return{app:APP_NAME,type:'posta_app_backup',ver:APP_VER,schema:1,exportedAt:new Date().toISOString(),photos:!!withPhotos,state:S,images}}
async function backupOut(){toast('バックアップを作成中…');const withPh=!UI.bkNoPhoto;const o=await backupObj(withPh);const d=new Date();

function validBackup(o){return o&&typeof o==='object'&&o.type==='posta_app_backup'&&o.state&&typeof o.state==='object'&&Array.isArray(o.state.items)&&Array.isArray(o.images)}
async function restoreBackup(o){const imgs=[];for(const x of o.images){if(!x||typeof x.id!=='string')continue;const b=await d2b(x.data);if(!b)continue;imgs.push({id:x.id,orig:b,at:x.at||Date.now(),item:x.item||null,kind:x.kind||null})}
  await idbClear();for(const r of imgs)await idbPut(r);URLS.forEach(u=>URL.revokeObjectURL(u));URLS.clear();

/* ---------- SSS 候補の取り込み（キーは SSS のアイテムID。タイトル等で照合しない） ---------- */
function sssList(o){if(Array.isArray(o))return o;if(!o||typeof o!=='object')return null;
  for(const k of ['candidates','items'])if(Array.isArray(o[k]))return o[k];if(o.data&&Array.isArray(o.data.items))return o.data.items;return null}
const first=(x,ks)=>{for(const k of ks)if(x[k]!=null&&x[k]!=='')return x[k];return null};
function sssImport(o){const list=sssList(o);if(!list)return{err:'SSS の候補JSONではありません（candidates / items の配列が必要です）'};
  const r={added:0,updated:0,skipped:0,bad:0};const backup=!!(o&&o.data&&Array.isArray(o.data.items));
  for(const x of list.slice(0,2000)){if(!x||typeof x!=='object'){r.bad++;continue}
    const sid=cpS(first(x,['sssId','sssItemId','itemId','id']),100).trim();if(!sid){r.bad++;continue}
    if(backup&&(x.st==='sold'||x.inSet)){r.skipped++;continue}
    const title=cpS(first(x,['title','name'])||'',200).trim();
    const pr={};const set=(k,v)=>{const n=cpN(v);if(n!=null)pr[k]=n};
    set('price',first(x,['listPrice','price','sellPrice']));set('cost',first(x,['cost','buyPrice','purchasePrice']));set('market',first(x,['market','marketCenter','marketPrice']));
    set('turnover',first(x,['turnover','rotation','soldPerMonth']));set('floor',first(x,['floor','minPrice']));set('shipping',first(x,['shipping','ship']));
    const md=cpDate(String(first(x,['marketDate','researchedAt','marketAt'])||'').slice(0,10));if(md)pr.marketDate=md;
    const la=String(first(x,['listedAt','listDate'])||'').slice(0,10);const st=String(first(x,['status','st'])||'');
    const plat=[...new Set((Array.isArray(x.platform)?x.platform:[x.platform||x.channel]).map(p=>({yahoo:'yahooflea',yahooFlea:'yahooflea'}[p]||p)).filter(p=>PLATS.includes(p)))];
    const ex=S.items.find(i=>i.sssId===sid);
    if(ex){ex.price=Object.assign({},ex.price||{},pr);if(cpDate(la)&&!ex.listedAt)ex.listedAt=la+'T00:00:00';ex.updatedAt=Date.now();r.updated++;continue}
    const it=newOwnItem({src:'sss',sssId:sid,work:title,itemRef:'SSS:'+sid,price:pr,platform:plat.length?plat:['mercari'],setk:x.setk?mapSetk(x.setk):null});
    if(x.setk==null){const g=guessFlags(it);Object.assign(it,{setk:g.setk,shoban:g.shoban,obi:g.obi,bonus:g.bonus});regen(it)}
    if(/listed|出品/.test(st)){it.listed=true;if(cpDate(la))it.listedAt=la+'T00:00:00';it.currentPrice=pr.price??null;if(!it.listedAt&&cpN(x.elapsedDays)!=null)it.elapsedBase=new Date(Date.now()-cpN(x.elapsedDays)*DAY).toISOString()}
    S.items.push(it);r.added++}
  save();return r}

/* ---------- 初回移行（posta_v2・posta_cp_v1・KOMA の IndexedDB。元のデータは消さない） ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function migratePosta(){const t=lsGet('posta_v2');let o=null;try{o=t?JSON.parse(t):null}catch(e){}
  if(o&&typeof o==='object'){if(Array.isArray(o.templates))S.templates=o.templates.map(normTpl).filter(Boolean);S.settings=Object.assign(S.settings,{feePct:num(o.settings&&o.settings.feePct)>=0?num(o.settings.feePct):S.settings.feePct,ship:num(o.settings&&o.settings.ship)>=0?num(o.settings.ship):S.settings.ship});
    S.migrated.posta_v2={at:new Date().toISOString(),note:`定型文 ${S.templates.length}件・計算の初期値を移行`};return}
  // posta_v2 が無く、旧 POSTA（posta_v1）だけがある場合は POSTA v2 と同じ規則で定型文と設定だけ引き継ぐ
  const t1=lsGet('posta_v1');let o1=null;try{o1=t1?JSON.parse(t1):null}catch(e){}
  if(o1&&typeof o1==='object'){const st=o1.settings||{};if(st.channel&&OLD_CH_FEE[st.channel]!=null)S.settings.feePct=OLD_CH_FEE[st.channel];
    for(const [k,v] of [['feePct',st.feePct],['ship',st.ship]])if(v!==undefined&&v!==''&&isFinite(Number(v)))S.settings[k]=Number(v);
    if(Array.isArray(o1.templates))S.templates=o1.templates.map(normTpl).filter(Boolean);S.migrated.posta_v2={at:new Date().toISOString(),note:'posta_v2 なし。posta_v1 から定型文・設定を移行'}}}
function migrateCp(){const t=lsGet('posta_cp_v1');let o=null;try{o=t?JSON.parse(t):null}catch(e){}if(!o||typeof o!=='object'||!Array.isArray(o.cards))return;let n=0;
  for(const c of o.cards){if(!c||!c.id||!KINDS.includes(c.kind)||!Array.isArray(c.platform))continue;if(S.items.some(x=>x.id===c.id))continue;
    const it=fixItem(Object.assign({},c,{src:'card',extPhotos:!!(c.links&&c.links.koma),createdAt:Date.now(),updatedAt:Date.now()}));
    if(it.doneAt&&it.kind==='draft'){it.listed=true;it.listedAt=it.doneAt;it.listPrice=cpPrice(it,it.platform[0]);it.currentPrice=it.listPrice}
    if(it.doneAt&&it.kind==='pricecut'){it.currentPrice=cpPrice(it,it.platform[0]);it.lastCutAt=it.doneAt}
    S.items.push(it);n++}
  if(Number.isFinite(o.importedVer))S.cp.importedVer=Math.max(S.cp.importedVer,o.importedVer);
  if(o.settings&&typeof o.settings==='object')for(const k of Object.keys(S.cp.settings))Object.assign(S.cp.settings[k],o.settings[k]||{});
  S.migrated.posta_cp_v1={at:new Date().toISOString(),note:`カード ${n}件（取り込み済み version ${o.importedVer||0}）を移行`}}
function openRaw(name){return new Promise(res=>{let r;try{r=indexedDB.open(name)}catch(e){res(null);return}r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)})}
async function migrateKoma(){const t=lsGet('koma_v1');let o=null;try{o=t?JSON.parse(t):null}catch(e){}if(!o||!Array.isArray(o.items))return;
  const kdb=await openRaw('koma');let recs=[];
  if(kdb){try{if(kdb.objectStoreNames.contains('imgs'))recs=await new Promise((res,rej)=>{const q=kdb.transaction('imgs','readonly').objectStore('imgs').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){}try{kdb.close()}catch(e){}}
  const byId=new Map(recs.map(r=>[r.id,r]));let n=0,ph=0;
  for(const k of o.items){if(!k||!k.id||!Array.isArray(k.shots))continue;const id='koma_'+k.id;if(S.items.some(x=>x.id===id))continue;
    const it=newOwnItem({id,src:'koma',sssId:k.sssId||'',work:String(k.title||''),setk:SETK.includes(k.setk)?k.setk:'単品',shoban:tri(k.shoban),obi:tri(k.obi),bonus:!!k.bonus,condBad:!!k.condBad,
      shobanVols:str(k.shobanVols),obiVols:str(k.obiVols),condMemo:str(k.condMemo),banner:k.banner&&typeof k.banner==='object'?{on:!!k.banner.on,text:str(k.banner.text)}:{on:false,text:''}});
    it.shots=k.shots.map(s=>Object.assign({},s));
    for(const s of it.shots){if(s.imgId){const r=byId.get(s.imgId);const b=srcOf(r);if(b){await idbPut({id:s.imgId,orig:b,at:r.at||Date.now(),item:it.id,kind:'photo'});ph++}else s.imgId=null}
      if(hasBlur(s.edit)){const r=byId.get(s.edit.blur.mask);const b=srcOf(r);if(b)await idbPut({id:s.edit.blur.mask,orig:b,at:r.at||Date.now(),item:it.id,kind:'mask'});else delete s.edit.blur}}
    finalize(it);S.items.push(it);n++}
  if(o.models&&typeof o.models==='object')for(const [k,mid] of Object.entries(o.models)){const r=byId.get(mid);const b=srcOf(r);if(b){await idbPut({id:mid,orig:b,at:r.at||Date.now(),kind:'model'});S.models[k]=mid}}
  S.migrated.koma={at:new Date().toISOString(),note:`商品 ${n}件・写真 ${ph}枚を移行`}}
// どの写真からも参照されなくなった背景ぼかしマスク・写真を起動時に片付ける
async function gcImgs(){let keys;try{keys=await idbKeys()}catch(e){return}const used=new Set(Object.values(S.models));
  for(const it of S.items)for(const s of it.shots||[]){if(s.imgId)used.add(s.imgId);if(hasBlur(s.edit))used.add(s.edit.blur.mask)}
  for(const k of keys||[])if(typeof k==='string'&&/^(k_|p_|t_)/.test(k)&&!used.has(k))await idbDel(k).catch(()=>{})}

function insertDesc(txt){const it=curItem();if(!it)return;const p=p0(it);let f=cpView(it,p).fields.find(f=>cpRole(f)==='desc');
  if(!f){if(it.src==='card'){toast('このカードには説明文の項目がありません');return}it.fields.push({key:'商品の説明',type:'copy',label:'商品の説明',value:'',role:'desc'});f=it.fields[it.fields.length-1]}
  const cur=cpVal(it,p,f);const s=cpSt(it,p);s.ed[f.key]=cur?cur.replace(/\s+$/,'')+'\n\n'+txt:txt;it.updatedAt=Date.now();save();rerender();toast('説明文に入れました')}

document.addEventListener('click',e=>{

function memoInput(el){const k=el.dataset&&el.dataset.memo;if(!k||!MEMO_KEYS.includes(k))return false;const it=curItem();if(!it)return true;if(it[k]!==el.value){it[k]=el.value;it.updatedAt=Date.now();save()}return true}
document.addEventListener('input',e=>{const el=e.target;
  if(memoInput(el))return;

    else if(['rc','rs','rf','rr'].includes(el.dataset.c))needUpdate();return}

function priceLive(el){const c=curItem();if(!c)return;const p=p0(c),n=num(el.value);if(!(n>=0))return;const k=calcAt(c,p,n);
  const a=$('#cpCostT');if(a)a.textContent='−'+yen(k.fee+k.ship+k.pack+(k.cost||0));const b=$('#cpProfit');if(b)b.textContent='利益 '+(k.profit!=null?yen(k.profit):'—');
  const w=$('#cpFloorW');if(w)w.hidden=!(k.floor!=null&&n<k.floor)}
document.addEventListener('change',async e=>{const el=e.target;
  if(memoInput(el))return;
  if(el.dataset.shot!==undefined&&el.files&&el.files[0]){const f=el.files[0];el.value='';const it=getI(el.dataset.item);if(it){UI.iid=it.id;await importPhoto(it,+el.dataset.shot,f)}return}
  if(el.dataset.col!==undefined){UI.csel[el.dataset.col]=el.checked;rerender();return}
  if(el.id==='gridOn'){UI.grid=el.checked;wireGrid();cropGrid();return}
  if(el.id==='autoBlur'){S.settings.autoBlur=el.checked;save();rerender();return}
  if(el.id==='extPh'){const it=curItem();it.extPhotos=el.checked;it.updatedAt=Date.now();save();rerender();return}
  if(el.id==='bkPh'){UI.bkNoPhoto=!el.checked;return}
  if(el.id==='bnOn'){const it=curItem();it.banner=Object.assign({text:''},it.banner,{on:el.checked});save();UI.prepared=null;ONE=null;rerender();return}
  if(el.id==='bnTx'){const it=curItem();const v=el.value.replace(/\s*\n\s*/g,' ').trim();it.banner=Object.assign({on:false},it.banner,{text:v===bannerDefault(it)?'':v});save();UI.prepared=null;ONE=null;rerender();return}
  if(el.id==='cpFile'){const f=el.files&&el.files[0];el.value='';if(!f)return;if(f.size>CP_MAX_FILE){UI.cpMsg='ファイルが大きすぎます（1MBまで）';rerender();return}

  if(el.id==='sssIn'){const f=el.files&&el.files[0];el.value='';if(!f)return;if(f.size>20*1024*1024){toast('ファイルが大きすぎます（20MBまで）');return}let o;try{o=JSON.parse(await f.text())}catch(_){toast('JSONを読み込めません');return}
    const r=sssImport(o);toast(r.err?r.err:`SSS 候補：追加 ${r.added}・更新 ${r.updated}${r.skipped?`・対象外 ${r.skipped}`:''}${r.bad?`・読めない ${r.bad}`:''}`);rerender();return}
  if(el.id==='bkIn'){const f=el.files&&el.files[0];el.value='';if(!f)return;let o;try{o=JSON.parse(await f.text())}catch(_){toast('JSONを読み込めません');return}

    if(!confirm(`今のデータ（商品${S.items.length}件・定型文${S.templates.length}件）を、バックアップ（${esc(String(o.exportedAt||'').slice(0,16))}・商品${o.state.items.length}件・写真${o.images.length}件）で全部置き換えます。\n今の写真もすべて消えます。元に戻せません。よろしいですか？`))return;
    toast('復元中…');const n=await restoreBackup(o);UI.view='queue';UI.iid=null;render();toast(`復元しました（商品${S.items.length}件・写真${n}件）`);return}
  if(el.dataset.cpprice!==undefined){const c=curItem();if(!c)return;const p=p0(c),n=num(el.value);if(!(n>=0)){toast('数字で入力してください');rerender();return}
    const v=cpView(c,p).price,s=cpSt(c,p);if(v&&v.price===Math.round(n))delete s.ed['@price'];else s.ed['@price']=Math.round(n);c.updatedAt=Date.now();save();rerender();return}
  if(el.dataset.cpset){const [g,p]=el.dataset.cpset.split('.');const n=num(el.value);
    if(!isFinite(n)||n<0||(g==='fee'&&n>=100)||(g!=='fee'&&(n<1||!Number.isInteger(n)))){toast('数字で入力してください');el.value=S.cp.settings[g][p];return}
    S.cp.settings[g][p]=n;el.value=n;save();toast('保存しました');return}
  if(el.dataset.set){const k=el.dataset.set;const n=num(el.value);if(!isFinite(n)||n<0||(k==='feePct'&&n>=100)||(k==='cutDays'&&!(n>=1))){toast('数字で入力してください');el.value=S.settings[k];return}
    if(k!=='cutDays'){const ck=k==='feePct'?'fee':'ship';if(C&&!C.res&&String(C[ck])===String(S.settings[k])){C[ck]=String(n);const ci=document.querySelector(`[data-c=${ck}]`);if(ci)ci.value=C[ck]}}
    S.settings[k]=n;el.value=n;save();toast('初期値を保存しました')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&(e.target.dataset.cpprice!==undefined||e.target.dataset.cpset)){e.preventDefault();e.target.blur();return}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.c){e.preventDefault();e.target.blur();if(!['lr','rc','rs','rf','rr'].includes(e.target.dataset.c))A.calcRun()}});
// スクロールで続きを読み込む（50件ずつ）
$('#view').addEventListener('scroll',()=>{if(UI.tab!=='list'||UI.view!=='queue')return;const m=$('#view');if(m.scrollTop+m.clientHeight<m.scrollHeight-200)return;
  const total=queueItems(UI.filter).length;if(UI.limit>=total)return;UI.limit+=50;rerender()},{passive:true});

/* ============================================================
   起動
   ============================================================ */
async function boot(){
  let saved=null;try{const r=await metaGet('S');saved=r&&r.v}catch(e){}
  if(saved){S=fixState(saved)}
  else{S=defState();
    // 初回：同一オリジンの既存データを読み取り移行（元のデータは消さない）
    try{migratePosta()}catch(e){}try{migrateCp()}catch(e){}try{await migrateKoma()}catch(e){}
    if(SEED_CARDS){const r=cpImport(SEED_CARDS);if(!r.err&&!r.ignored&&(r.added||r.replaced))UI.cpMsg='初期データ：'+cpImportMsg(r)}
    await saveNow()}
  C=calcNew();
  // §6-4：起動時に1回だけ永続化を要求
  try{if(navigator.storage&&navigator.storage.persist){const p=await navigator.storage.persist().catch(()=>null);if(p!=null){S.persist=!!p;save(false)}}}catch(e){}
  render();
  cpAutoStart();
  runDueShrinks();setInterval(runDueShrinks,60*60*1000);
  capacity().then(()=>{if(UI.cap&&UI.cap.pct>=70)rerender()});
  gcImgs()}
window.__ready=boot();
</script>
