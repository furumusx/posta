<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>POSTA - 出品メモ × 利益計算</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--card2:#eef0f3;--line:#dde1e7;--tx:#16191f;--mut:#6b7280;--acc:#2f6fed;--acc-tx:#ffffff;
  --pos:#14894a;--neg:#d23b3b;--warn:#b7791f;--chipbg:#e8eefc;
  --tabh:58px;--safe:env(safe-area-inset-bottom,0px);--sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--r-lg:14px;--r-md:10px;--r-sm:8px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#181b22;--card2:#1f232c;--line:#2b303b;--tx:#e9ecf2;--mut:#98a1b0;--acc:#5aa9ff;--acc-tx:#04203f;
  --pos:#2fd27a;--neg:#ff6b6b;--warn:#f5b83d;--chipbg:#1d2a3f;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{touch-action:manipulation;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
header{flex:none;display:flex;align-items:center;gap:var(--sp2);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:19px;margin:0;letter-spacing:.1em;flex:1}
header .hb{background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:34px;padding:0 var(--sp3);font-size:13px}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:var(--sp3) var(--sp3) calc(var(--tabh) + var(--safe) + 84px)}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe);height:calc(var(--tabh) + var(--safe))}
nav#tabs button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
nav#tabs button .i{font-size:20px;line-height:1}
nav#tabs button.on{color:var(--tx);font-weight:700}
nav#tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp3);margin-bottom:var(--sp2)}
.row{display:flex;gap:var(--sp2);align-items:center}
.grow{flex:1;min-width:0}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:44px;padding:0 var(--sp3);font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-tx);font-weight:700}
.btn.dng{color:var(--neg)}
.btn.sm{height:32px;padding:0 var(--sp2);font-size:12px;border-radius:var(--r-sm)}
.btns{display:flex;gap:var(--sp2);flex-wrap:wrap}
.srch{display:flex;gap:var(--sp2);margin-bottom:var(--sp2)}
.srch input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);height:44px;padding:0 var(--sp3)}
.chips{display:flex;gap:var(--sp2);overflow-x:auto;margin-bottom:var(--sp2);padding-bottom:2px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;height:32px;padding:0 var(--sp3);font-size:13px;color:var(--mut);display:inline-flex;align-items:center}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-tx);font-weight:700}
.badge{font-size:11px;border-radius:6px;padding:1px 6px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.badge.draft{color:var(--mut)}.badge.listed{color:var(--acc);border-color:var(--acc)}.badge.sold{color:var(--pos);border-color:var(--pos)}.badge.relist{color:var(--warn);border-color:var(--warn)}
.lc .top{display:flex;gap:var(--sp3)}
.lc img{width:56px;height:56px;object-fit:cover;border-radius:var(--r-sm);flex:none;background:var(--card2)}
.lc .t{font-weight:700;overflow-wrap:anywhere}
.lc .s{font-size:12px;color:var(--mut)}
.lc .price{font-family:var(--mono);font-weight:700}
.lc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--sp2)}
.fab{position:fixed;right:16px;bottom:calc(var(--tabh) + var(--safe) + 16px);z-index:25;height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--acc);color:var(--acc-tx);font-weight:800;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + var(--safe) + 8px);z-index:26;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp2) var(--sp3);display:flex;gap:var(--sp2);align-items:center;flex-wrap:wrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.chk{width:22px;height:22px;flex:none;accent-color:var(--acc)}
.fld{margin-bottom:var(--sp3);min-width:0}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:var(--sp1)}
.fld input,.fld select,.fld textarea{width:100%;min-width:0;max-width:100%;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:44px;padding:0 var(--sp2)}
.fld textarea{height:auto;min-height:120px;padding:var(--sp2);line-height:1.6}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 var(--sp2)}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:0 var(--sp2)}
.sec{font-size:13px;color:var(--mut);margin:var(--sp4) var(--sp1) var(--sp2);font-weight:700}
.note{font-size:12px;color:var(--mut)}
.warn{color:var(--warn);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#sheet[hidden]{display:none}
#sheet .sh{display:flex;align-items:center;gap:var(--sp2);padding:calc(env(safe-area-inset-top,0px) + 12px) var(--sp3) var(--sp3);border-bottom:1px solid var(--line);background:var(--card)}
#sheet .sh h2{font-size:17px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .sb{flex:1;overflow:auto;padding:var(--sp3) var(--sp3) calc(40px + var(--safe))}
#saved{font-size:12px;color:var(--pos);min-width:90px;text-align:right}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 60px);z-index:70;background:#2a3140;color:#fff;padding:var(--sp3) var(--sp4);border-radius:var(--r-md);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
#mini{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#mini[hidden]{display:none}
#mini .mbox{width:100%;background:var(--card);border-radius:16px 16px 0 0;padding:16px 12px calc(16px + var(--safe))}
.imgs{display:flex;gap:var(--sp2);flex-wrap:wrap}
.imgs .im{position:relative;width:72px;height:72px}
.imgs img{width:72px;height:72px;object-fit:cover;border-radius:var(--r-sm)}
.imgs .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:12px;border:0;background:var(--neg);color:#fff;font-size:13px;line-height:24px;padding:0}
.gen{border:2px solid var(--acc);border-radius:var(--r-lg);padding:var(--sp3);margin-bottom:var(--sp3);background:var(--card)}
.gen h3{margin:0 0 var(--sp2);font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--sp2)}
.opts label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--card2)}
.opts input{accent-color:var(--acc)}
.pv{white-space:pre-wrap;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp2);font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.pvt{font-weight:700;overflow-wrap:anywhere}
#cam{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#000;height:160px;margin-bottom:var(--sp2)}
#cam video{width:100%;height:100%;object-fit:cover}
#cam .guide{position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(255,80,80,.85)}
.res-big{font-size:34px;font-weight:800;font-family:var(--mono);line-height:1.1}
.res-big.pos{color:var(--pos)}.res-big.neg{color:var(--neg)}
.jb{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;border:2px solid}
.jb.j1{color:var(--pos);border-color:var(--pos)}.jb.j2{color:var(--acc);border-color:var(--acc)}.jb.j3{color:var(--warn);border-color:var(--warn)}.jb.j4{color:var(--neg);border-color:var(--neg)}
table{border-collapse:collapse;width:100%;font-size:13px}
td{padding:6px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-family:var(--mono)}
tr.under td{color:var(--neg)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp2)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp3)}
.kpi label{display:block;font-size:12px;color:var(--mut)}
.kpi b{font-size:20px;font-family:var(--mono)}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 var(--sp3)}
.inline{display:flex;gap:var(--sp2);align-items:center}
.inline input{width:100%;min-width:0;flex:1}
.inline .btn{flex:none;white-space:nowrap}
</style>
</head>
<body>
<header><h1>POSTA</h1><button class="hb" data-act="openData">データ</button><button class="hb" data-act="openFolders">フォルダ</button></header>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="memo"><span class="i">📝</span>出品メモ</button>
  <button data-tab="tpl"><span class="i">💬</span>定型文</button>
  <button data-tab="calc"><span class="i">🧮</span>計算</button>
</nav>
<div id="sheet" hidden><div class="sh"><h2 id="shT"></h2><span id="saved"></span><button class="btn sm" data-act="closeSheet">閉じる</button></div><div class="sb" id="shB"></div></div>
<div id="mini" hidden></div>
<div id="toast"></div>
<script>
'use strict';
const KEY='posta_v1';
const STATUS={draft:'下書き',listed:'出品中',sold:'売れた',relist:'再出品待ち'};
const CONDS=['新品、未使用','未使用に近い','目立った傷や汚れなし','やや傷や汚れあり','傷や汚れあり','全体的に状態が悪い'];
const CATS=['本・漫画・雑誌','CD・DVD','ゲーム','トレカ','おもちゃ・ホビー','衣類','その他'];
const PLAT={mercari:{name:'メルカリ',url:'https://jp.mercari.com/'},rakuma:{name:'ラクマ',url:'https://fril.jp/'},yahoo:{name:'Yahoo!フリマ',url:'https://paypayfleamarket.yahoo.co.jp/'}};
const CHP=[{k:'mercari',name:'メルカリ',fee:10},{k:'yahoo',name:'Yahoo!フリマ',fee:5},{k:'rakuma',name:'ラクマ',fee:10},{k:'yahuoku',name:'ヤフオク',fee:10},{k:'custom',name:'カスタム',fee:null}];
const SSSCH={'メルカリ':'m','Yahoo!フリマ':'y','ラクマ':'r','ヤフオク':'a'};
const TCATS=['買った時','売れた時','コメント','受取評価','その他'];
const VARS=['{商品名}','{価格}','{状態}','{発送方法}','{今日}'];
const POINTS=['ヤケあり','スレあり','小口の汚れ','折れあり','書き込みあり','特になし（きれい）'];

/* ---------- 保存 ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const RECV_TPL=['買った時','受け取りました','商品を受け取りました。迅速で丁寧なご対応をありがとうございました。またご縁がありましたら、よろしくお願いいたします。'];
function presets(){const t=Date.now();const P=[
  ['買った時','購入の挨拶','購入させていただきました。お取引が完了するまで、よろしくお願いいたします。'],
  ['売れた時','購入お礼＋発送予定','この度は {商品名} をご購入いただき、ありがとうございます。{今日}〜2日以内に発送いたします。発送後に改めてご連絡しますので、よろしくお願いいたします。'],
  ['売れた時','発送完了の連絡','発送が完了しましたのでご連絡いたします。お手元に届くまで今しばらくお待ちください。よろしくお願いいたします。'],
  ['コメント','値下げ交渉へのお返事（受ける）','コメントありがとうございます。ご提示の金額でお譲りできますので、価格を変更いたしました。ご検討よろしくお願いいたします。'],
  ['コメント','値下げ交渉へのお返事（断る）','コメントありがとうございます。申し訳ありませんが、{商品名} は現在の価格が限界のため、値下げはお受けできません。ご理解いただけますと幸いです。'],
  ['コメント','バラ売りについて','コメントありがとうございます。申し訳ありませんが、こちらはセットでの販売のみとなっております。バラ売りは行っておりませんので、ご了承ください。'],
  ['コメント','帯・初版の質問への回答','コメントありがとうございます。帯・初版の有無については、商品写真と説明文に記載の通りとなります。追加の写真が必要でしたらお知らせください。'],
  ['受取評価','受取評価のお願い','無事に届きましたでしょうか。問題がなければ、受取評価をよろしくお願いいたします。こちらも届き次第、評価させていただきます。'],
  ['受取評価','取引完了のお礼','受取評価ありがとうございました。こちらも評価させていただきました。またご縁がありましたら、よろしくお願いいたします。'],
  RECV_TPL];
  return P.map(([c,ti,b],i)=>({id:uid()+i,category:c,title:ti,body:b,createdAt:t+i,updatedAt:t+i}))}
function defState(){return{folders:['漫画セット','単巻','その他'].map((n,i)=>({id:uid()+'f'+i,name:n})),listings:[],templates:presets(),records:[],
  settings:{launch:'mercari',channel:'mercari',target:30,sssUrl:'https://furumusx.github.io/SedoScope/'}}}
function fix(s){const d=defState();if(!s||typeof s!=='object')return d;
  for(const k of ['folders','listings','templates','records'])if(!Array.isArray(s[k]))s[k]=[];
  s.settings=Object.assign(d.settings,s.settings||{});return s}
function load(){
  try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);const need=!(o&&o.settings&&o.settings.migRecv);const s=fix(o);
    // 既存データへ「受け取りました」を1回だけ補完（移行フラグ。削除済みを復活させない）
    if(need){if(!s.templates.some(x=>x.title===RECV_TPL[1])){const n=Date.now();s.templates.push({id:uid()+'r',category:RECV_TPL[0],title:RECV_TPL[1],body:RECV_TPL[2],createdAt:n,updatedAt:n})}
      s.settings.migRecv=1;try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
    return s}}catch(e){}
  const d=defState();d.settings.migRecv=1;try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}return d}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('保存できませんでした（容量不足の可能性。画像を減らすか、データを書き出してください）');return false}}

/* ---------- 小道具 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(v){if(v===null||v===undefined||v==='')return 0;if(typeof v==='number')return isFinite(v)?v:0;const t=String(v).normalize('NFKC').replace(/[,¥￥円\s]/g,'');const n=parseFloat(t);return isFinite(n)?n:0}
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const ceil10=x=>Math.ceil(x/10-1e-9)*10, floor10=x=>Math.floor(x/10+1e-9)*10;
function ymd(t){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('コピーしました');return true}catch(e){
  const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);
  let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();toast(ok?'コピーしました':'コピーできませんでした');return ok}}
function getL(id){return S.listings.find(l=>l.id===id)||null}
function folderName(id){const f=S.folders.find(x=>x.id===id);return f?f.name:'未分類'}
function newListing(o){const t=Date.now();return Object.assign({id:uid(),title:'',desc:'',price:0,cost:0,costShip:0,category:'本・漫画・雑誌',condition:'',folderId:'',status:'draft',listedAt:null,images:[],platform:S.settings.launch||'mercari',note:'',gen:defGen(),createdAt:t,updatedAt:t},o)}
function defGen(){return{work:'',author:'',publisher:'',outline:'',tags:'',isbn:'',kind:'',from:'',to:'',shohan:'',shohanVols:'',obi:'',obiVols:'',tokuten:'',points:[],tagCands:[]}}

/* ============================================================
   A. 出品メモ
   ============================================================ */
const UI={tab:'memo',q:'',folder:'all',sel:false,picked:{},tq:'',tcat:'all',month:ymd(Date.now()).slice(0,7)};
let EDIT=null,saveT=null;
function memoHTML(){
  const q=UI.q.normalize('NFKC').toLowerCase();
  let arr=S.listings.slice().sort((a,b)=>b.updatedAt-a.updatedAt);
  if(UI.folder!=='all')arr=arr.filter(l=>(l.folderId||'')===(UI.folder==='none'?'':UI.folder));
  if(q)arr=arr.filter(l=>(l.title+' '+l.desc+' '+(l.note||'')).normalize('NFKC').toLowerCase().includes(q));
  const pk=Object.keys(UI.picked).filter(k=>UI.picked[k]);
  return `<div class="srch"><input id="mq" type="search" placeholder="商品名・説明文で検索" value="${esc(UI.q)}"><button class="btn ${UI.sel?'pri':''}" data-act="selMode">${UI.sel?'選択中':'選択'}</button></div>
  <div class="chips"><button class="chip ${UI.folder==='all'?'on':''}" data-act="fChip" data-v="all">すべて</button>${S.folders.map(f=>`<button class="chip ${UI.folder===f.id?'on':''}" data-act="fChip" data-v="${esc(f.id)}">${esc(f.name)}</button>`).join('')}<button class="chip ${UI.folder==='none'?'on':''}" data-act="fChip" data-v="none">未分類</button></div>
  <div class="btns" style="margin-bottom:8px"><button class="btn sm" data-act="pasteOpen">📋 貼り付けで追加</button></div>
  ${arr.map(l=>{const days=l.status==='listed'&&l.listedAt?Math.floor((Date.now()-l.listedAt)/864e5):null;
    return `<div class="card lc"><div class="top">${UI.sel?`<input type="checkbox" class="chk" data-pick="${esc(l.id)}" ${UI.picked[l.id]?'checked':''}>`:''}${l.images&&l.images[0]?`<img src="${l.images[0]}" alt="">`:''}
    <div class="grow"><div class="t">${esc(l.title||'（商品名なし）')}</div>
    <div class="s"><span class="badge ${l.status}">${STATUS[l.status]||''}</span> ${esc(folderName(l.folderId))}${days!==null?` ・出品から${days}日`:''}${l.sssId?' ・SSS連携':''}</div>
    <div class="price">${l.price?yen(l.price):'価格未設定'}</div></div></div>

  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('この環境ではカメラを使えません。ISBNを手入力してください');return}
  const w=$('#camWrap');if(!w)return;w.innerHTML='<div id="cam"><video playsinline muted autoplay></video><div class="guide"></div></div>';const v=w.querySelector('video');
  try{Scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false})}catch(e){w.innerHTML='';toast('カメラを起動できません。ISBNを手入力してください');return}
  v.srcObject=Scan.stream;try{await v.play()}catch(e){}
  Scan.det=null;if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes('ean_13'))Scan.det=new BarcodeDetector({formats:['ean_13']})}catch(e){}}
  Scan.on=true;Scan.cand='';Scan.candN=0;loop(v);
}
function stopScan(){Scan.on=false;clearTimeout(Scan.timer);if(Scan.stream){Scan.stream.getTracks().forEach(t=>t.stop());Scan.stream=null}const w=$('#camWrap');if(w)w.innerHTML=''}
async function loop(v){if(!Scan.on)return;let code=null;
  try{if(Scan.det){const r=await Scan.det.detect(v);for(const b of r)if(okScanCode(b.rawValue)){code=b.rawValue;break}}else code=decodeFrame(v)}catch(e){}
  if(code){if(!Scan.det){if(code===Scan.cand)Scan.candN++;else{Scan.cand=code;Scan.candN=1}}
    if(Scan.det||Scan.candN>=2){stopScan();$('#isbnIn').value=code;isbnGo();return}}
  Scan.timer=setTimeout(()=>loop(v),Scan.det?150:80)}
async function isbnGo(){
  if(!EDIT)return;const isbn=normIsbn($('#isbnIn').value);const msg=$('#isbnMsg');
  if(!/^97[89]\d{10}$/.test(isbn)||!ean13ok(isbn)){msg.textContent='ISBN（978/979で始まる13桁）を確認してください';return}
  EDIT.gen.isbn=isbn;touch();msg.textContent='書誌を取得中…';
  let s=null;try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),8000);const r=await fetch('https://api.openbd.jp/v1/get?isbn='+isbn,{signal:ctl.signal});clearTimeout(tm);const j=await r.json();s=j&&j[0]&&j[0].summary}catch(e){s=null}
  if(!EDIT)return;
  if(!s||!s.title){msg.textContent='書誌情報が見つかりませんでした（手入力で続けられます）';return}
  const g=EDIT.gen;let title=String(s.title||'').trim();let vol=String(s.volume||'').trim();
  const m=title.match(/^(.*?)[\s　]*(\d{1,3})$/);if(!vol&&m){vol=m[2];title=m[1].trim()}else if(vol&&title.endsWith(vol))title=title.slice(0,-vol.length).trim();
  const author=String(s.author||'').replace(/[／\/]\s*(著|作|画|原作|漫画|イラスト|絵|著者)[^,，]*/g,'').replace(/\s+/g,' ').trim();
  const fill=(k,v)=>{if(!v)return;if(g[k]&&g[k]!==v&&!confirm(`「${{work:'作品名',author:'著者名',publisher:'出版社'}[k]}」を「${v}」で上書きしますか？\n（今の値：${g[k]}）`))return;g[k]=v};
  fill('work',title);g._workAuto=0;if(!String(EDIT.title||'').trim()&&s.title)EDIT.title=String(s.title).trim();if(isSetKind(g))syncWork(g);fill('author',author);fill('publisher',String(s.publisher||'').trim());
  if(vol&&/^\d+$/.test(vol)&&!g.from&&!g.to){g.from=vol;g.to=vol}
  touch();drawEdit(true);$('#isbnMsg').textContent='書誌を取得しました（巻数は仮の値です。必要なら直してください）';
}

function calcNums(){const sale=num(C.sale),cost=num(C.cost),costShip=num(C.costShip),ship=num(C.ship),pack=num(C.pack),other=num(C.other),fp=num(C.feePct),t=num(S.settings.target);

  const fixed=cost+costShip+ship+pack+other;const totalCost=fixed+fee;
  const be=(100-fp)>0?Math.ceil(fixed*100/(100-fp)-1e-9):null;

/* ============================================================
   F. SSS連携
   ============================================================ */
function parseRange(s){const m=String(s||'').normalize('NFKC').match(/^(\d+)\s*[-~〜]\s*(\d+)$/);if(m)return[+m[1],+m[2]];const n=String(s||'').normalize('NFKC').match(/^(\d+)$/);return n?[+n[1],+n[1]]:null}
function parseVols(s){const set=new Set();String(s||'').normalize('NFKC').split(/[,、\s]+/).forEach(p=>{const m=p.match(/^(\d+)(?:[-~〜](\d+))?$/);if(!m)return;const a=+m[1],b=m[2]?+m[2]:a;if(Math.abs(b-a)>500)return;for(let i=Math.min(a,b);i<=Math.max(a,b);i++)set.add(i)});return set}
function condMap(c){c=String(c||'').trim();if(!c)return['',''];if(c==='状態が悪い')return['全体的に状態が悪い',''];if(c==='新品・未使用')return['新品、未使用',''];if(CONDS.includes(c))return[c,''];return['',c]}
function fromSSS(o){
  const g=defGen();const notes=[];
  g.work=String(o.work||'');g.author=String(o.author||'');g.publisher=String(o.pub||'');g.isbn=String(o.code||'');
  const rg=parseRange(o.range);if(rg){g.from=String(rg[0]);g.to=String(rg[1])}
  const sk=String(o.setk||'').trim();
  if(sk==='単巻'){g.kind='single'}else if(sk==='全巻セット')g.kind='set';else if(sk==='途中セット'||sk==='セット')g.kind='partial';else if(sk)notes.push('区分：'+sk);
  if(o.have){notes.push('手元の巻：'+o.have);if(rg){const h=parseVols(o.have);const miss=[];for(let v=rg[0];v<=rg[1];v++)if(!h.has(v))miss.push(v);if(miss.length)notes.push('欠巻の可能性：'+miss.join(','))}}
  const [cd,cn]=condMap(o.cond);if(cn)notes.push('状態（SSS）：'+cn);
  const tg=Array.isArray(o.tags)?o.tags:String(o.tags||'').split(/[,、\s]+/);g.tagCands=tg.map(x=>String(x).trim()).filter(Boolean);
  if(o.memo)notes.push(String(o.memo));
  if(!g.work&&o.name)g.work=workFromTitle(o.name);
  if(isSetKind(g)){const v=o.have?volsCsv(o.have):(o.range?volsCsv(o.range):'');if(v){g.vols=v;g.work=workWithVols(g)}}
  const lp=num(o.listPrice),pm=num(o.pm);
  return newListing({title:String(o.name||''),price:lp||pm||0,cost:num(o.cost),costShip:num(o.other),condition:cd,status:'draft',note:notes.join('\n'),gen:g,sssId:o.id!=null?String(o.id):undefined});
}

function sssDo(){const ks=[...document.querySelectorAll('[data-sssk]:checked')].map(e=>+e.dataset.sssk);if(!ks.length){toast('商品を選んでください');return}

   ============================================================ */
function dataOpen(){const s=S.settings;openSheet('データ',`<div class="card"><div class="sec" style="margin-top:0">書き出し</div><div class="btns"><button class="btn pri" data-act="exp">ファイルに書き出す</button><button class="btn" data-act="expCopy">コピー</button></div></div>
  <div class="card"><div class="sec" style="margin-top:0">POSTAのデータを取り込む（全データを置き換え）</div><div class="fld"><input type="file" id="impF" accept=".json,application/json,text/plain"></div>
  <div class="fld"><textarea id="impT" placeholder="または書き出したJSONを貼り付け" style="min-height:80px"></textarea></div><button class="btn dng" data-act="imp">取り込む（全置換）</button></div>
  <div class="card"><div class="sec" style="margin-top:0">SSS連携</div><button class="btn" data-act="sssOpen">SSSバックアップから取り込む（追加のみ）</button>
  <div class="fld" style="margin-top:10px"><label>SSSのURL（「SSSで売却登録」で開く先）</label><input data-set="sssUrl" value="${esc(s.sssUrl)}"></div></div>
  <div class="card"><div class="sec" style="margin-top:0">既定値</div><div class="grid2"><div class="fld"><label>新規メモの出品先</label>${sel('',Object.entries(PLAT).map(([k,v])=>[k,v.name]),s.launch,'data-set="launch"')}</div>
  <div class="fld"><label>計算の販路</label>${sel('',CHP.filter(p=>p.k!=='custom').map(p=>[p.k,p.name]),s.channel,'data-set="channel"')}</div></div></div>
  <div class="note">出品メモ ${S.listings.length}件／定型文 ${S.templates.length}件</div>`)}
function foldersOpen(){openSheet('フォルダ',`${S.folders.map(f=>`<div class="card row"><input class="grow" data-fname="${esc(f.id)}" value="${esc(f.name)}" style="background:var(--card2);border:1px solid var(--line);border-radius:10px;height:40px;padding:0 8px"><button class="btn sm dng" data-act="fDel" data-id="${esc(f.id)}">削除</button></div>`).join('')}
  <div class="row"><input id="fNew" class="grow" placeholder="新しいフォルダ名" style="background:var(--card2);border:1px solid var(--line);border-radius:10px;height:44px;padding:0 8px"><button class="btn pri" data-act="fAdd">追加</button></div>
  <div class="note" style="margin-top:8px">フォルダを削除すると、中のメモは「未分類」になります。</div>`)}

/* ============================================================
   描画・操作
   ============================================================ */
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));const v=$('#view');
  v.innerHTML=UI.tab==='memo'?memoHTML():UI.tab==='tpl'?tplHTML():calcHTML();if(UI.tab==='calc')updCalc()}
function setTab(t){UI.tab=t;render();$('#view').scrollTop=0}
function toCalcFrom(l){calcReset();const pk=l.platform==='yahoo'?'yahoo':l.platform==='rakuma'?'rakuma':'mercari';const p=CHP.find(x=>x.k===pk);
  Object.assign(C,{name:l.title||'',sale:l.price||'',cost:l.cost||'',costShip:l.costShip||'',channel:p.k,feePct:p.fee,listingId:l.id});setTab('calc')}
const A={
  closeSheet(){closeSheet()},openData(){dataOpen()},openFolders(){foldersOpen()},
  fChip(b){UI.folder=b.dataset.v;render()},
  selMode(){UI.sel=!UI.sel;UI.picked={};render()},
  newMemo(){const l=newListing({folderId:UI.folder!=='all'&&UI.folder!=='none'?UI.folder:''});S.listings.unshift(l);save();openEdit(l.id)},
  edit(b){openEdit(b.dataset.id)},
  cpAll(b){const l=getL(b.dataset.id);if(l)copyText(full(l))},cpTitle(b){const l=getL(b.dataset.id);if(l)copyText(l.title||'')},cpDesc(b){const l=getL(b.dataset.id);if(l)copyText(l.desc||'')},
  openPlat(b){const l=getL(b.dataset.id);if(!l)return;const p=PLAT[l.platform]||PLAT.mercari;copyText(l.desc||'');window.open(p.url,'_blank','noopener')},
  toCalc(b){const l=getL(b.dataset.id);if(l)toCalcFrom(l)},
  bulkDel(){const ids=Object.keys(UI.picked).filter(k=>UI.picked[k]);if(!ids.length){toast('メモを選んでください');return}if(!confirm(`${ids.length}件の出品メモを削除しますか？`))return;S.listings=S.listings.filter(l=>!ids.includes(l.id));UI.picked={};save();render()},
  pasteOpen(){openSheet('貼り付けで追加',`<div class="note" style="margin-bottom:8px">1行目が商品名、2行目以降が説明文になります。「3,500円」「¥3500」のような金額があれば金額に入れます。</div><div class="fld"><textarea id="pasteT" style="min-height:200px"></textarea></div><button class="btn pri" data-act="pasteDo">出品メモを作成</button>`)},
  pasteDo(){const t=($('#pasteT').value||'').replace(/\r/g,'');if(!t.trim()){toast('テキストを貼り付けてください');return}const ls=t.split('\n');const title=ls[0].trim();const desc=ls.slice(1).join('\n').trim();
    const m=t.normalize('NFKC').match(/[¥￥]\s*([\d,]+)|([\d,]{3,})\s*円/);const price=m?num(m[1]||m[2]):0;const l=newListing({title,desc,price});S.listings.unshift(l);save();closeSheet();toast('出品メモを作成しました')},
  imgDel(b){EDIT.images.splice(+b.dataset.i,1);touch();drawEdit(true)},
  dupRelist(){const c=JSON.parse(JSON.stringify(EDIT));Object.assign(c,{id:uid(),status:'relist',listedAt:null,createdAt:Date.now(),updatedAt:Date.now()});delete c.sssId;S.listings.unshift(c);save();toast('「再出品待ち」として複製しました');openEdit(c.id)},
  delMemo(){if(!confirm('この出品メモを削除しますか？'))return;S.listings=S.listings.filter(l=>l.id!==EDIT.id);save();EDIT=null;closeSheet()},
  tagTog(b){const g=EDIT.gen;const t=b.dataset.t;let a=tagList(g.tags);a=a.includes(t)?a.filter(x=>x!==t):[...a,t];g.tags=a.join(' ');const i=document.querySelector('[data-g="tags"]');if(i)i.value=g.tags;touch();updGen()},
  genApply(){const g=EDIT.gen;const t=genTitle(g),d=genBody(g);if(!g.work){toast('作品名を入力してください');return}
    if(EDIT.title&&EDIT.title!==t&&!confirm('商品名に入力済みの内容を、生成したタイトルで上書きしますか？')){}else EDIT.title=t;
    if(EDIT.desc&&EDIT.desc!==d&&!confirm('説明文に入力済みの内容を、生成した本文で上書きしますか？')){}else EDIT.desc=d;
    touch();drawEdit(true);toast('反映しました')},
  isbnGo(){isbnGo()},scanToggle(){Scan.on?stopScan():startScan()},
  tChip(b){UI.tcat=b.dataset.v;render()},newTpl(){openTpl(null)},tplEdit(b){openTpl(b.dataset.id)},tplCopy(b){tplCopy(b.dataset.id)},
  insVar(b){const ta=$('#tB');const s=ta.selectionStart??ta.value.length,e=ta.selectionEnd??s;ta.value=ta.value.slice(0,s)+b.dataset.v+ta.value.slice(e);ta.focus();const p=s+b.dataset.v.length;ta.setSelectionRange(p,p)},
  tplSave(){Object.assign(TEDIT,{category:$('#tC').value,title:$('#tT').value.trim()||'（無題）',body:$('#tB').value,updatedAt:Date.now()});if(TEDIT._new){delete TEDIT._new;S.templates.unshift(TEDIT)}save();closeSheet();toast('保存しました')},
  tplDel(){if(!confirm('この定型文を削除しますか？'))return;S.templates=S.templates.filter(t=>t.id!==TEDIT.id);save();closeSheet()},
  tplFill(b){const t=S.templates.find(x=>x.id===b.dataset.t),l=getL(b.dataset.id);copyText(fillVars(t.body,l));closeSheet()},
  tplRaw(b){const t=S.templates.find(x=>x.id===b.dataset.t);copyText(fillVars(t.body,null));closeSheet()},
  chSel(b){const p=CHP.find(x=>x.k===b.dataset.v);C.channel=p.k;if(p.fee!=null){C.feePct=p.fee;C.ship=210}render()},
  shipQ(b){C.ship=+b.dataset.v;const i=document.querySelector('[data-c="ship"]');if(i)i.value=C.ship;updCalc()},
  calcUnlink(){C.listingId=null;render()},
  calcToMemo(){const l=newListing({title:C.name||'',price:num(C.sale),cost:num(C.cost),costShip:num(C.costShip),status:'draft'});S.listings.unshift(l);save();C.listingId=l.id;setTab('memo');toast('出品メモ（下書き）を作成しました')},
  calcClear(){calcReset();render()},
  toSSS(b){const l=getL(b.dataset.id);if(!l||!l.sssId)return;if(!String(S.settings.sssUrl||'').trim()){toast('データ画面でSSSのURLを入力してください');return}window.open(sssSoldUrl(l),'_blank','noopener')},
  soldEdit(){if(EDIT)soldOpen(EDIT,'sold')},
  soldSave(){const l=SOLD&&getL(SOLD.id);if(!l){soldClose();return}const p=num($('#sdP').value);if(!p){toast('売却価格を入力してください');return}
    Object.assign(l,{soldPrice:p,soldDate:$('#sdD').value||ymd(Date.now()),soldCh:$('#sdC').value,soldFee:num($('#sdF').value),updatedAt:Date.now()});save();soldClose();if(EDIT&&EDIT.id===l.id)drawEdit(true);else render();toast('売却情報を保存しました')},
  soldCancel(){const l=SOLD&&getL(SOLD.id);if(l&&SOLD.prev&&SOLD.prev!=='sold'){l.status=SOLD.prev;save()}soldClose();if(EDIT)drawEdit(true)},
  exp(){const t=JSON.stringify(S);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=`posta_backup_${ymd(Date.now()).replace(/-/g,'')}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('書き出しました')},
  expCopy(){copyText(JSON.stringify(S))},
  async imp(){const f=$('#impF');let t='';if(f&&f.files&&f.files[0])t=await f.files[0].text();else t=$('#impT').value;let o;try{o=JSON.parse(t)}catch(e){toast('JSONを読み込めません');return}
    if(!o||!Array.isArray(o.listings)||!Array.isArray(o.templates)){toast('POSTAのデータではありません');return}
    if(!confirm(`今のデータ（出品メモ${S.listings.length}件・定型文${S.templates.length}件）をすべて置き換えます。よろしいですか？`))return;S=fix(o);save();closeSheet();toast('取り込みました')},
  sssOpen(){sssImportOpen()},sssDo(){sssDo()},
  fAdd(){const v=($('#fNew').value||'').trim();if(!v)return;S.folders.push({id:uid(),name:v});save();foldersOpen()},
  fDel(b){const f=S.folders.find(x=>x.id===b.dataset.id);if(!f||!confirm(`フォルダ「${f.name}」を削除しますか？（中のメモは未分類になります）`))return;S.folders=S.folders.filter(x=>x.id!==f.id);S.listings.forEach(l=>{if(l.folderId===f.id)l.folderId=''});if(UI.folder===f.id)UI.folder='all';save();foldersOpen()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){setTab(t.dataset.tab);return}
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b,e)}});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='mq'){UI.q=el.value;clearTimeout(UI.qt);UI.qt=setTimeout(()=>{const p=el.selectionStart;render();const n=$('#mq');n.focus();try{n.setSelectionRange(p,p)}catch(_){}},250);return}
  if(el.id==='tq'){UI.tq=el.value;clearTimeout(UI.qt);UI.qt=setTimeout(()=>{const p=el.selectionStart;render();const n=$('#tq');n.focus();try{n.setSelectionRange(p,p)}catch(_){}},250);return}
  if(el.dataset.lf&&EDIT){const k=el.dataset.lf;if(el.tagName==='SELECT')return;EDIT[k]=el.dataset.n?num(el.value):el.value;if(k==='title'){updCount();$('#shT').textContent=EDIT.title||'出品メモ';const g=EDIT.gen;
      if(!g.work||g._workAuto){g.work=workFromTitle(EDIT.title);g._workAuto=g.work?1:0;if(isSetKind(g))syncWork(g);const wi=document.querySelector('[data-g="work"]');if(wi)wi.value=g.work;updGen()}}touch();return}
  if(el.dataset.g&&EDIT&&el.type!=='radio'){const g=EDIT.gen,k=el.dataset.g;g[k]=el.value;
    if(k==='work')g._workAuto=0;
    if(isSetKind(g)&&(k==='vols'||k==='from'||k==='to')){
      if(k==='vols')g._volsManual=el.value.trim()?1:0;
      else if(!g._volsManual){const f=num(g.from),t=num(g.to)||f;g.vols=f?volsCsv(`${f}-${Math.max(f,t)}`):'';const vi=document.querySelector('[data-g="vols"]');if(vi)vi.value=g.vols}
      syncWork(g);const wi=document.querySelector('[data-g="work"]');if(wi&&document.activeElement!==wi)wi.value=g.work}
    touch();updGen();return}
  if(el.dataset.c){C[el.dataset.c]=el.value;if(el.dataset.c==='feePct'){const p=CHP.find(x=>x.k===C.channel);if(!p||p.fee!==num(el.value)){C.channel='custom';document.querySelectorAll('[data-act=chSel]').forEach(x=>x.classList.toggle('on',x.dataset.v==='custom'))}}updCalc();return}
  if(el.dataset.target){S.settings.target=num(el.value);save();updCalc();return}
});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.dataset.pick){UI.picked[el.dataset.pick]=el.checked;render();return}
  if(el.id==='bulkF'){const v=el.value;if(!v)return;const ids=Object.keys(UI.picked).filter(k=>UI.picked[k]);if(!ids.length){toast('メモを選んでください');el.value='';return}S.listings.forEach(l=>{if(ids.includes(l.id))l.folderId=v==='__none'?'':v});save();toast(`${ids.length}件のフォルダを変更しました`);render();return}
  if(el.dataset.lf&&EDIT&&el.tagName==='SELECT'){const k=el.dataset.lf;if(k==='status'){const prev=EDIT.status;setStatus(EDIT,el.value);touch();if(el.value==='sold'&&prev!=='sold')soldOpen(EDIT,prev);else drawEdit(true);return}else EDIT[k]=el.value;touch();return}
  if(el.dataset.g&&EDIT&&el.type==='radio'){const k=el.dataset.g;if(k==='tokutenOn'){if(el.value==='0'){EDIT.gen.tokuten='';EDIT.gen._tok=0}else EDIT.gen._tok=1}else{EDIT.gen[k]=el.value;if(k==='kind'){const g=EDIT.gen;if(isSetKind(g)&&!g.vols&&num(g.from)){const f=num(g.from),t=num(g.to)||f;g.vols=volsCsv(`${f}-${Math.max(f,t)}`)}syncWork(g)}}touch();drawEdit(true);return}
  if(el.dataset.gp&&EDIT){const g=EDIT.gen;const p=el.dataset.gp;let a=(g.points||[]).filter(x=>x!==p);if(el.checked){if(p==='特になし（きれい）')a=[p];else a=a.filter(x=>x!=='特になし（きれい）').concat(p)}g.points=POINTS.filter(x=>a.includes(x));touch();drawEdit(true);return}
  if(el.id==='imgIn'&&EDIT){const fs=[...el.files].slice(0,8-EDIT.images.length);for(const f of fs){try{EDIT.images.push(await resizeImg(f))}catch(_){toast('画像を読み込めませんでした')}}touch();drawEdit(true);return}
  if(el.dataset.set){S.settings[el.dataset.set]=el.value.trim();save();return}
  if(el.dataset.fname){const f=S.folders.find(x=>x.id===el.dataset.fname);if(f&&el.value.trim()){f.name=el.value.trim();save()}return}
  if(el.id==='sssF'&&el.files[0]){sssLoad(el.files[0]);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='isbnIn'){e.preventDefault();isbnGo()}});
window.addEventListener('pagehide',()=>{flushSave();stopScan()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){flushSave();stopScan()}});
render();sssFromURL();
</script>
</body>
