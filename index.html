<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>POSTA - 定型文 × 利益計算</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--card2:#eef0f3;--line:#dde1e7;--tx:#16191f;--mut:#6b7280;--acc:#2f6fed;--acc-tx:#ffffff;
  --pos:#14894a;--neg:#d23b3b;--star:#e0a100;
  --tabh:58px;--safe:env(safe-area-inset-bottom,0px);--sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--r-lg:14px;--r-md:10px;--r-sm:8px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#181b22;--card2:#1f232c;--line:#2b303b;--tx:#e9ecf2;--mut:#98a1b0;--acc:#5aa9ff;--acc-tx:#04203f;
  --pos:#2fd27a;--neg:#ff6b6b;--star:#f5c84d;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{touch-action:manipulation;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{flex:none;display:flex;align-items:center;gap:var(--sp2);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:19px;margin:0;letter-spacing:.1em;flex:1}
header .v{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:var(--sp3) var(--sp3) calc(var(--tabh) + var(--safe) + 24px)}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe);height:calc(var(--tabh) + var(--safe))}
nav#tabs button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
nav#tabs button .i{font-size:20px;line-height:1}
nav#tabs button.on{color:var(--tx);font-weight:700}
nav#tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp3);margin-bottom:var(--sp2)}
.row{display:flex;gap:var(--sp2);align-items:center}
.grow{flex:1;min-width:0}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:44px;padding:0 var(--sp3);font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-tx);font-weight:700}
.btn.dng{color:var(--neg)}
.btn.sm{height:32px;padding:0 var(--sp2);font-size:12px;border-radius:var(--r-sm)}
.btn.wide{flex:1}
.btns{display:flex;gap:var(--sp2);flex-wrap:wrap}
.srch{display:flex;gap:var(--sp2);margin-bottom:var(--sp2)}
.srch input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);height:44px;padding:0 var(--sp3)}
.chips{display:flex;gap:var(--sp2);overflow-x:auto;margin-bottom:var(--sp2);padding-bottom:2px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;height:32px;padding:0 var(--sp3);font-size:13px;color:var(--mut);display:inline-flex;align-items:center}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-tx);font-weight:700}
.fld{margin-bottom:var(--sp3);min-width:0}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:var(--sp1)}
.fld input,.fld select,.fld textarea{width:100%;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:44px;padding:0 var(--sp2)}
.fld textarea{height:auto;min-height:200px;padding:var(--sp2);line-height:1.6}
.sec{font-size:13px;color:var(--mut);margin:var(--sp4) var(--sp1) var(--sp2);font-weight:700}
.note{font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
/* 定型文 */
.tp{display:flex;gap:var(--sp2);align-items:flex-start}
.tp .body{flex:1;min-width:0;cursor:pointer}
.tp .t{font-weight:700;overflow-wrap:anywhere}
.tp .b{font-size:13px;color:var(--mut);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.tp .tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;font-weight:400;white-space:nowrap}
.tp .side{display:flex;flex-direction:column;gap:6px;flex:none}
.star{width:40px;height:36px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card2);font-size:18px;line-height:1;color:var(--mut)}
.star.on{color:var(--star);border-color:var(--star)}
.hint{font-size:11px;color:var(--acc);margin-top:4px}
/* 計算（iOS設定画面風のグループリスト） */
.gl{font-size:13px;color:var(--mut);margin:var(--sp3) 16px 6px}
.gl:first-child{margin-top:var(--sp1)}
.gc{background:var(--card);border-radius:20px;overflow:hidden}
.gr{display:flex;align-items:center;gap:var(--sp2);min-height:52px;padding:0 16px;position:relative;font-size:17px;cursor:text}
.gr+.gr::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.gr .lb{flex:none}
.gr input{flex:1;min-width:0;border:0;background:transparent;outline:none;text-align:right;font-size:17px;padding:0;height:50px;font-variant-numeric:tabular-nums;color:var(--tx)}
.gr input::placeholder{color:var(--mut)}
.gr .u{flex:none;color:var(--mut);min-width:1.1em;text-align:right}
.gr .val{flex:1;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.gr .val.pos{color:var(--pos)}.gr .val.neg{color:var(--neg)}
.gb{display:block;width:100%;min-height:50px;border:0;background:transparent;color:var(--acc);font-size:17px;text-align:center;position:relative}
.gb+.gb::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.gn{font-size:12px;color:var(--mut);margin:6px 16px 0}
details.gset{margin-top:var(--sp3)}
details.gset summary{list-style:none;font-size:13px;color:var(--mut);margin:0 16px 6px;cursor:pointer}
details.gset summary::-webkit-details-marker{display:none}
details.gset summary::after{content:" ▸"}details.gset[open] summary::after{content:" ▾"}
@media (max-height:1000px){.gr{min-height:44px;font-size:16px}.gr input{height:42px;font-size:16px}.gb{min-height:44px;font-size:16px}.gl{margin:10px 16px 4px}.gn{margin-top:3px;font-size:11px}
  .gbtns{display:flex}.gbtns .gb{flex:1}.gbtns .gb+.gb::before{top:8px;bottom:8px;left:0;right:auto;border-top:0;border-left:1px solid var(--line)}}
@media (max-height:900px){main{padding-top:6px}.gr{min-height:39px}.gr input{height:37px}.gb{min-height:39px}.gl{margin:7px 16px 3px;font-size:12px}.gn{margin-top:2px;line-height:1.35}.gc[style]{margin-top:7px!important}details.gset{margin-top:8px}}
@media (max-height:740px){main{padding-top:4px}.gr{min-height:35px;font-size:15px}.gr input{height:33px;font-size:16px}.gb{min-height:36px;font-size:15px}.gl{margin:5px 16px 2px;font-size:12px}.gn{margin-top:2px;font-size:11px;line-height:1.3}.gc[style]{margin-top:5px!important}header{padding-top:calc(env(safe-area-inset-top,0px) + 4px);padding-bottom:4px}details.gset{margin-top:6px}}
/* シート */
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#sheet[hidden]{display:none}
#sheet .sh{display:flex;align-items:center;gap:var(--sp2);padding:calc(env(safe-area-inset-top,0px) + 12px) var(--sp3) var(--sp3);border-bottom:1px solid var(--line);background:var(--card)}
#sheet .sh h2{font-size:17px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .sb{flex:1;overflow:auto;padding:var(--sp3) var(--sp3) calc(40px + var(--safe))}
.pv{white-space:pre-wrap;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp2);font-size:13px;line-height:1.6;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 60px);z-index:70;background:#2a3140;color:#fff;padding:var(--sp3) var(--sp4);border-radius:var(--r-md);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
/* コピペ出品モード（v2.1.0） */
:root{--cp:#e60023;--cpb:#1f6feb;--cpok:#2e9e4f;--cpng:#c81e1e;--cpold:#b3261e;--cpnew:#23713a}
@media (prefers-color-scheme:dark){:root{--cp:#ff3b5c;--cpb:#4b8dff;--cpok:#3cc36a;--cpng:#ff5a5a;--cpold:#ff7b72;--cpnew:#4fd27f}}
header .hsub{font-size:13px;font-weight:700;white-space:nowrap}
header .hcnt{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
header .hcnt b{background:var(--cp);color:#fff;border-radius:999px;min-width:26px;height:26px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
header [hidden]{display:none!important}
header .hcnt small{font-size:10px;color:var(--mut);margin-top:2px}
nav#tabs button .nb{position:absolute;top:5px;left:calc(50% + 8px);background:var(--cp);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;padding:0 4px;line-height:16px;font-weight:700}
.cpt{font-size:20px;font-weight:800;color:var(--cp)}
.qtabs{display:flex;gap:var(--sp2);margin:var(--sp3) 0}
.qtabs button{flex:1;min-width:0;height:48px;border:0;border-radius:12px;background:var(--card2);color:var(--mut);font-weight:700;font-size:15px;padding:0 4px;white-space:nowrap}
.qtabs button.on{background:var(--cp);color:#fff}
.qtabs button:disabled{opacity:.45;cursor:default}
.qtabs button .bd{display:inline-block;min-width:1.4em;font-variant-numeric:tabular-nums}
.qc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:var(--sp3) var(--sp4);margin-bottom:var(--sp3);cursor:pointer}
.qc.hold,.cphold{background:rgba(200,30,30,.06);border:2px solid rgba(200,30,30,.35)}
.qh{display:flex;align-items:center;gap:var(--sp2);flex-wrap:wrap;margin-bottom:6px}
.kb{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;color:#fff;background:var(--cpb);white-space:nowrap}
.kb.draft{background:#c2410c}.kb.pricecut{background:#9a6200}.kb.hold{background:var(--cpng)}.kb.done{background:var(--cpok)}
.qh .pl{font-size:13px;color:var(--mut)}
.qh .hr{font-size:14px;font-weight:700;color:var(--cpng)}
.sc{margin-left:auto;font-size:11px;border-radius:6px;padding:1px 8px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.sc.doing{color:var(--cpb);border-color:var(--cpb)}.sc.hold{color:var(--cpng);border-color:var(--cpng)}
.qc .w{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.qc .l{font-size:14px;overflow-wrap:anywhere}
.qc .m{font-size:13px;color:var(--mut)}
.old{color:var(--cpold)}.new{color:var(--cpnew)}
.qf{display:flex;justify-content:flex-end;margin-top:var(--sp2)}
.cpbtn{border:0;border-radius:999px;min-height:44px;padding:0 18px;font-weight:700;font-size:14px;background:var(--cpb);color:#fff;white-space:nowrap}
.cpbtn.red{background:var(--cpng)}.cpbtn.gray,.cpbtn.done{background:var(--card2);color:var(--mut)}
.cpbtn:disabled{background:var(--card2);color:var(--mut);opacity:.6;cursor:not-allowed}
.cpinfo{background:rgba(31,111,235,.08);border-radius:18px;padding:var(--sp3) var(--sp4);margin-top:var(--sp3)}
.cpinfo b{color:var(--cpb)}
.cpbar{display:flex;align-items:center;gap:var(--sp2);margin-bottom:var(--sp2)}
.ih{display:flex;gap:var(--sp3);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:var(--sp3)}
.th{width:84px;height:84px;border-radius:10px;flex:none;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.th b{font-size:20px;line-height:1.1}.th small{font-size:11px;opacity:.85}
.ih .w{font-size:18px;font-weight:800;overflow-wrap:anywhere;line-height:1.3}
.ih .s{font-size:14px;color:var(--mut);overflow-wrap:anywhere}
.lks{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lk{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.lk.sss{background:rgba(36,86,166,.12);color:#2f6fd0}.lk.koma{background:rgba(35,113,58,.12);color:#2a8a47}.lk.ai{background:rgba(154,98,0,.12);color:#b07400}
.ptabs{display:flex;gap:var(--sp2);margin:var(--sp3) 0}
.ptabs button{flex:1;min-width:0;height:50px;border:0;border-radius:12px;background:var(--card2);color:var(--mut);font-weight:700;font-size:15px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptabs button.on{background:var(--cp);color:#fff}
.ptabs button:disabled{opacity:.4;cursor:default;font-weight:400}
.pgh{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}.pgh b{color:var(--cp)}
.pgb{height:10px;border-radius:5px;background:var(--line);margin:4px 0 var(--sp3);overflow:hidden}.pgb i{display:block;height:100%;background:var(--cp);border-radius:5px}
.cps{font-size:15px;font-weight:700;margin:var(--sp3) 2px var(--sp2)}
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:var(--sp2)}
.phs button{aspect-ratio:1;border:0;border-radius:10px;color:#fff;position:relative;font-size:12px;font-weight:600;padding:26px 3px 4px;line-height:1.25;opacity:.55;overflow-wrap:anywhere}
@media (min-width:600px){.phs{grid-template-columns:repeat(6,1fr)}.phs button{font-size:14px}}
.phs button.on{opacity:1}
.phs button.on::after{content:"✓";position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--cpok);color:#fff;font-size:13px;line-height:22px;font-weight:700}
.phs button:disabled{cursor:not-allowed}
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:var(--sp3) var(--sp4);margin-bottom:var(--sp3)}
.fc .hd{display:flex;align-items:center;justify-content:space-between;gap:var(--sp2);font-size:14px;color:var(--mut);font-weight:700}
.cnt{font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}.cnt.over{color:var(--neg);font-weight:700}
.fc .v{font-size:17px;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}
.fc .v.long{font-size:14px;font-weight:400;line-height:1.65;max-height:12em;overflow:auto}
.fc .cur{font-size:14px;margin-top:6px;overflow-wrap:anywhere;white-space:pre-wrap}
.fc .ft{display:flex;align-items:center;gap:var(--sp2);flex-wrap:wrap;margin-top:var(--sp2)}
.fc .ft .cpbtn{margin-left:auto}
.ck{border:1px solid var(--line);background:var(--card2);color:var(--mut);border-radius:999px;height:32px;padding:0 12px;font-size:13px;white-space:nowrap}
.ck.on{background:rgba(46,158,79,.12);border-color:var(--cpok);color:var(--cpok);font-weight:700}
.ck:disabled{opacity:.5;cursor:not-allowed}
.vb{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;background:rgba(36,86,166,.12);color:#2f6fd0}
.edm{font-size:12px;color:var(--cpb)}
.sgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--sp2) var(--sp3)}
.sgs .fc{margin-bottom:0}
.sgs .sel{font-size:16px;font-weight:700;overflow-wrap:anywhere;margin:4px 0}
.pp{background:rgba(255,170,0,.10);border:1px solid rgba(200,140,0,.35);border-radius:16px;padding:var(--sp3) var(--sp4);margin-top:var(--sp3)}
.pp .hd{display:flex;justify-content:space-between;gap:var(--sp2);flex-wrap:wrap;font-weight:700;color:#b07400}
.pp .hd span{font-weight:400}
.pp .r{display:flex;justify-content:space-between;align-items:center;gap:var(--sp2);font-size:16px;min-height:34px}
.pp .r b{font-variant-numeric:tabular-nums;font-size:17px}
.pp .r input{width:120px;text-align:right;font-weight:700;font-size:17px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);height:40px;padding:0 8px;font-variant-numeric:tabular-nums}
.pp .d{font-size:14px;color:var(--mut);overflow-wrap:anywhere}
.pp .nx{font-size:14px;color:#b07400;margin-top:4px;overflow-wrap:anywhere}
.pp .pos{color:var(--pos)}.pp .neg{color:var(--neg)}
.cta{display:block;width:100%;min-height:62px;border:0;border-radius:31px;background:var(--cp);color:#fff;font-size:18px;font-weight:800;margin-top:var(--sp4);padding:0 16px}
.cta:disabled{opacity:.45;cursor:not-allowed}
.cpdone{background:rgba(46,158,79,.10);border:1px solid var(--cpok);border-radius:16px;padding:var(--sp3) var(--sp4);margin-top:var(--sp4);overflow-wrap:anywhere}
.cpmemo textarea{width:100%;min-height:90px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp2)}
.hi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:var(--sp3) var(--sp4);margin-bottom:var(--sp2)}
.hi .rs{font-size:13px;overflow-wrap:anywhere;margin-top:4px}
.cpset .gr input{max-width:110px}
</style>
</head>
<body>
<header><h1>POSTA</h1><span class="hsub" id="hsub" hidden>コピペ出品モード</span><span class="hcnt" id="hcnt" hidden></span><span class="v" id="ver"></span></header>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="tpl"><span class="i">💬</span>定型文</button>
  <button data-tab="calc"><span class="i">🧮</span>計算</button>
  <button data-tab="cp"><span class="i">📋</span>コピペ出品<span class="nb" id="nb" hidden></span></button>
</nav>
<div id="sheet" hidden><div class="sh"><h2 id="shT"></h2><button class="btn sm" data-act="closeSheet">閉じる</button></div><div class="sb" id="shB"></div></div>
<div id="toast"></div>
<script>
'use strict';
const APP_VER='2.1.1';
const KEY='posta_v2',OLD_KEY='posta_v1';
const TCATS=['買った時','売れた時','コメント','受取評価','その他'];
const VARS=['{商品名}','{価格}','{状態}','{発送方法}','{今日}'];
const OLD_CH_FEE={mercari:10,yahoo:5,rakuma:10,yahuoku:10};

/* ---------- 保存 ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function presets(){const t=Date.now();const P=[
  ['買った時','購入の挨拶','購入させていただきました。お取引が完了するまで、よろしくお願いいたします。'],
  ['売れた時','購入お礼＋発送予定','この度は {商品名} をご購入いただき、ありがとうございます。{今日}〜2日以内に発送いたします。発送後に改めてご連絡しますので、よろしくお願いいたします。'],
  ['売れた時','発送完了の連絡','発送が完了しましたのでご連絡いたします。お手元に届くまで今しばらくお待ちください。よろしくお願いいたします。'],
  ['コメント','値下げ交渉へのお返事（受ける）','コメントありがとうございます。ご提示の金額でお譲りできますので、価格を変更いたしました。ご検討よろしくお願いいたします。'],
  ['コメント','値下げ交渉へのお返事（断る）','コメントありがとうございます。申し訳ありませんが、{商品名} は現在の価格が限界のため、値下げはお受けできません。ご理解いただけますと幸いです。'],

/* ============================================================
   計算（販売価格・原価・配送料・手数料% → 利益・利益率）
   ============================================================ */
let C=null;
function calcReset(){const keep=C?{lp:C.lp,lv:C.lv,lr:C.lr,rc:C.rc,rs:C.rs,rf:C.rf,rr:C.rr}:{lp:'',lv:'',lr:'30',rc:'',rs:String(S.settings.ship??''),rf:String(S.settings.feePct??10),rr:''};C={...keep,sale:'',cost:'',ship:String(S.settings.ship??''),fee:String(S.settings.feePct??10),res:null}}
calcReset();
function calcRun(){const sale=num(C.sale),cost=num(C.cost)||0,ship=num(C.ship)||0,fp=num(C.fee);
  if(!(sale>0)){toast('販売価格を入力してください');return}if(!isFinite(fp)){toast('手数料（%）を入力してください');return}
  const fee=Math.round(sale*fp/100);const profit=sale-cost-ship-fee;C.res={profit,rate:profit/sale*100,fee};render()}
// v2.0.2：1冊あたりの定価＝定価÷巻数（四捨五入）。利益計算とは独立・入力のたびに結果だけ更新
function perVolTxt(){const lp=num(C.lp),lv=num(C.lv);if(!isFinite(lp)||!isFinite(lv)||lv<=0||C.lp===''||C.lv==='')return '—';return yen(Math.round(lp/lv))}
// v2.0.3：上限の目安＝floor(（定価÷巻数）×掛け率÷100)。途中で丸めず最後に切り捨て（lp*lr/(lv*100) と同値。浮動小数の誤差を減らすため整数どうしで割る）
function capTxt(){const lp=num(C.lp),lv=num(C.lv),lr=num(C.lr);if(!(lp>0)||!(lv>0)||!(lr>0))return '—';return yen(Math.floor(lp*lr/(lv*100)))}
// v2.0.3：出品価格の逆算。必要出品価格＝ceil((原価＋配送料)÷(1−手数料%−目標利益率%))。
// 分母を%のまま (100−手数料−目標) で扱い、整数入力では誤差なし。小数入力の誤差で1円上がらないよう微小量を引いてから切り上げる。
function needCalc(){const c=num(C.rc),s=num(C.rs),f=num(C.rf),r=num(C.rr);
  if(![c,s,f,r].every(isFinite)||c<0||s<0||f<0)return null;const den=100-f-r;if(!(den>0))return null;
  const need=Math.ceil((c+s)*100/den-1e-9);return{need,profit:need-need*f/100-c-s}}
function needHTML(){const n=needCalc();return{need:n?yen(n.need):'—',profit:n?yen(n.profit):'—',cls:n?(n.profit>=0?'pos':'neg'):''}}
function needUpdate(){const n=needHTML(),a=$('#rNeed'),b=$('#rNeedP');if(a)a.textContent=n.need;if(b){b.textContent=n.profit;b.className='val '+n.cls}}

/* ---------- 取り込みデータの正規化（外部ファイルなので、型・長さ・選択肢を絞ってから保存する） ---------- */
const cpS=(v,max=5000)=>v==null?'':String(v).slice(0,max);
const cpN=v=>{const n=num(v);return isFinite(n)?n:null};
const cpDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))?String(v):'';
function cpNormFields(a){if(!Array.isArray(a))return null;const out=[],seen={};
  for(const f of a.slice(0,40)){if(!f||typeof f!=='object')continue;
    const label=cpS(f.label,40).trim();if(!label)continue;seen[label]=(seen[label]||0)+1;
    const o={key:seen[label]>1?label+'#'+seen[label]:label,type:f.type==='select'?'select':'copy',label,value:cpS(f.value)};
    if(f.currentValue!=null&&f.currentValue!=='')o.currentValue=cpS(f.currentValue);
    if(f.badge)o.badge=cpS(f.badge,30);if(f.role==='title'||f.role==='desc')o.role=f.role;out.push(o)}
  return out}
function cpNormPrice(p){if(!p||typeof p!=='object')return null;const o={};
  for(const k of ['price','shipping','packing','cost','floor','feePct','market'])if(cpN(p[k])!=null)o[k]=cpN(p[k]);
  if(o.feePct!=null&&!(o.feePct>=0&&o.feePct<100))delete o.feePct;
  if(p.nextCut&&typeof p.nextCut==='object'){const d=cpDate(p.nextCut.date),pr=cpN(p.nextCut.price);if(d||pr!=null)o.nextCut={date:d,price:pr}}
  return o}

  const id=cpS(r.id,100).trim();if(!id||!KINDS.includes(r.kind))return null;
  const pl=[...new Set((Array.isArray(r.platform)?r.platform:[r.platform]).filter(p=>PLATS.includes(p)))];if(!pl.length)return null;
  const c={id,kind:r.kind,platform:pl,itemRef:cpS(r.itemRef,200),work:cpS(r.work,200),sub:cpS(r.sub,200),currentPrice:cpN(r.currentPrice),
    holdReason:r.holdReason?cpS(r.holdReason,200):null,holdDetail:r.holdDetail?cpS(r.holdDetail,1000):'',
    fields:cpNormFields(r.fields)||[],photos:cpNormPhotos(r.photos)||[],price:cpNormPrice(r.price),links:{},thumb:null,per:{}};
  if(r.links&&typeof r.links==='object')for(const k of ['sss','koma','ai'])if(r.links[k])c.links[k]=1;
  if(r.thumb&&typeof r.thumb==='object')c.thumb={text:cpS(r.thumb.text,8),sub:cpS(r.thumb.sub,12),color:/^#[0-9a-fA-F]{3,6}$/.test(r.thumb.color||'')?r.thumb.color:''};
  if(r.perPlatform&&typeof r.perPlatform==='object')for(const p of pl){const x=r.perPlatform[p];if(!x||typeof x!=='object')continue;const o={};
    const f=cpNormFields(x.fields);if(f)o.fields=f;const ph=cpNormPhotos(x.photos);if(ph)o.photos=ph;const pr=cpNormPrice(x.price);if(pr)o.price=pr;c.per[p]=o}
  return c}

/* ---------- 取り込み（バージョンゲート：version が取り込み済み以下なら何もしない） ----------
   同じ id は AI 側のデータだけ置き換え、ユーザーの作業状態（チェック・手で直した値・メモ）は引き継ぐ。
   完了済み（履歴にある）カードは置き換えない。取り込みに含まれないカードは消さない。 */
function cpImport(obj){
  if(!obj||typeof obj!=='object'||Array.isArray(obj))return{err:'形式が違います（{"version":…,"cards":[…]} のJSONが必要です）'};
  const v=Number(obj.version);if(!Number.isInteger(v)||v<1)return{err:'version（1以上の整数）がありません'};
  if(!Array.isArray(obj.cards))return{err:'cards（カードの一覧）がありません'};
  if(v<=CP.importedVer)return{ignored:true,v,cur:CP.importedVer};
  const r={v,added:0,replaced:0,keptDone:0,bad:0};const now=new Date().toISOString();
  for(const raw of obj.cards.slice(0,500)){const n=cpNorm(raw);if(!n){r.bad++;continue}
    const i=CP.cards.findIndex(x=>x.id===n.id);
    if(i<0){Object.assign(n,{st:{},memo:'',doneAt:null,importedAt:now,importVer:v});CP.cards.push(n);r.added++;continue}
    const old=CP.cards[i];if(old.doneAt){r.keptDone++;continue}
    Object.assign(n,{st:old.st||{},memo:old.memo||'',doneAt:null,importedAt:old.importedAt||now,updatedAt:now,importVer:v});CP.cards[i]=n;r.replaced++}
  CP.importedVer=v;CP.lastImport=Object.assign({at:now},r);cpSave();return r}
function cpImportMsg(r){if(r.err)return '取り込めませんでした：'+r.err;
  if(r.ignored)return `version ${r.v} は取り込み済み（現在 ${r.cur}）なので無視しました`;
  return `version ${r.v} を取り込みました：追加 ${r.added}・置き換え ${r.replaced}${r.keptDone?`・完了済みのため据え置き ${r.keptDone}`:''}${r.bad?`・読めないカード ${r.bad}`:''}`}

/* ---------- カードの値 ---------- */
function cpView(c,p){const x=c.per&&c.per[p]||{};const pr=(c.price||x.price)?Object.assign({},c.price||{},x.price||{}):null;
  return{fields:x.fields||c.fields,photos:x.photos||c.photos,price:pr}}
function cpSt(c,p){if(!c.st)c.st={};return c.st[p]||(c.st[p]={chk:{},ed:{},done:null})}
function cpVal(c,p,f){const e=cpSt(c,p).ed[f.key];return e!=null?e:f.value}
const cpLen=s=>Array.from(String(s)).length;
function cpRole(f){if(f.role)return f.role;if(/^(商品名|タイトル)$/.test(f.label))return 'title';if(/説明/.test(f.label))return 'desc';return ''}
function cpMax(f,p){const r=cpRole(f);return r==='title'?CP.settings.titleMax[p]:r==='desc'?CP.settings.descMax[p]:null}
function cpField(c,p,key){return cpView(c,p).fields.find(f=>f.key===key)}
function cpPrice(c,p){const e=cpSt(c,p).ed['@price'];if(e!=null)return e;const v=cpView(c,p).price;return v&&v.price!=null?v.price:null}
function cpFee(c,p){const v=cpView(c,p).price;return v&&v.feePct!=null?v.feePct:Number(CP.settings.fee[p])}
// 価格パネルの式：手数料=round(販売価格×率)、手取り=販売価格−手数料−送料−梱包、利益=手取り−原価
function cpCalc(c,p){const v=cpView(c,p).price||{},P=cpPrice(c,p);if(P==null)return null;
  const rate=cpFee(c,p),fee=Math.round(P*rate/100),ship=v.shipping||0,pack=v.packing||0,net=P-fee-ship-pack;
  return{P,rate,fee,ship,pack,net,cost:v.cost,profit:v.cost!=null?net-v.cost:null,floor:v.floor,market:v.market,nextCut:v.nextCut}}
// 進捗の項目：写真（全部チェックで1項目）＋各フィールド＋価格入力（下書き）／価格変更（値下げ）
function cpItems(c,p){const v=cpView(c,p),s=cpSt(c,p),it=[];
  if(v.photos.length)it.push({key:'@photos',ok:v.photos.every((l,i)=>s.chk['@ph'+i]===l)});
  v.fields.forEach(f=>it.push({key:f.key,ok:s.chk[f.key]===cpVal(c,p,f)}));
  if((c.kind==='draft'||c.kind==='pricecut')&&cpPrice(c,p)!=null)it.push({key:'@price',ok:s.chk['@price']===String(cpPrice(c,p))});
  return it}
function cpProg(c,p){const it=cpItems(c,p);return{done:it.filter(x=>x.ok).length,total:it.length}}
function cpStatus(c){if(c.doneAt)return 'done';if(c.holdReason)return 'hold';
  return c.platform.some(p=>{const s=c.st&&c.st[p];return s&&(Object.keys(s.chk).length||s.done)})?'doing':'todo'}
const cpOpen=()=>CP.cards.filter(c=>!c.doneAt);
const cpMD=d=>{const m=/^\d{4}-(\d{2})-(\d{2})$/.exec(d||'');return m?`${+m[1]}/${+m[2]}`:''};
function cpDT(iso){if(!iso)return '';const d=new Date(iso);return isNaN(d)?'':`${ymd(d)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function cpAddDays(d,n){const t=new Date(d+'T00:00:00');t.setDate(t.getDate()+n);return ymd(t)}
// 値下げカード：今回の下げ幅で最終ラインまで何回下げられるか（最後の1回は最終ラインで止める）。週1回の改定前提で日付を出す。
function cpCutPlan(c,p){const k=cpCalc(c,p);if(!k)return null;const cur=c.currentPrice,fl=k.floor;
  const step=cur!=null?cur-k.P:null;const nc=k.nextCut||{};
  if(fl==null)return{step,left:null};if(k.P<=fl)return{step,left:0};
  const st=nc.price!=null&&nc.price<k.P?k.P-nc.price:step;if(!(st>0))return{step,left:null};
  const left=Math.ceil((k.P-fl)/st);const first=nc.date||cpAddDays(ymd(Date.now()),7);
  return{step,left,first,last:cpAddDays(first,(left-1)*7)}}

/* ---------- コピー（navigator.clipboard → execCommand（iOS Safari 対応の選択方法）→ 手でコピー用の表示） ---------- */
function cpCopyLegacy(t){const a=document.createElement('textarea');a.value=t;
  a.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0';
  a.contentEditable='true';a.readOnly=false;document.body.appendChild(a);let ok=false;
  try{const r=document.createRange();r.selectNodeContents(a);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);a.setSelectionRange(0,t.length);ok=document.execCommand('copy');sel.removeAllRanges()}catch(_){ok=false}
  a.remove();return ok}
async function cpCopyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(t);return true}catch(e){}}
  if(cpCopyLegacy(t))return true;
  openSheet('手でコピーしてください',`<div class="note" style="margin-bottom:8px">この端末では自動コピーができませんでした。下の文を長押しして「コピー」を選んでください。</div>
  <div class="fld"><textarea id="cpManual" readonly>${esc(t)}</textarea></div>`);
  const m=$('#cpManual');if(m){m.focus();m.select()}return false}

  ${cps.length?`<div class="cps">${c.kind==='fix'?'直す項目（現在 → 修正）':'テキスト'}</div>${cps.map(f=>cpFieldHTML(c,p,f,hold)).join('')}`:''}

function cpSetHTML(){const s=CP.settings,li=CP.lastImport;
  const row=(g,p,l,u)=>`<label class="gr"><span class="lb">${l}</span><input data-cpset="${g}.${p}" inputmode="decimal" value="${esc(s[g][p])}"><span class="u">${u}</span></label>`;

  <div class="gl">カードの取り込み</div><div class="card" style="border-radius:20px">

  <div class="gl">説明文の文字数上限</div><div class="gc">${PLATS.map(p=>row('descMax',p,PLAT_J[p],'字')).join('')}</div></div>
  <div class="gl">書き出し</div><div class="card" style="border-radius:20px"><button class="btn" data-act="cpExport">履歴をJSONで書き出す</button>
  <div class="note" style="margin-top:6px">データはこの端末の中だけに保存されます（外部へは送りません）。</div></div>`}
function cpHTML(){if(UI.cv==='card'){const c=CP.cards.find(x=>x.id===UI.cid);if(c)return cpCardHTML(c);UI.cv='queue'}
  return UI.cv==='hist'?cpHistHTML():UI.cv==='set'?cpSetHTML():cpQueueHTML()}
function cpBadges(){const n=cpOpen().length,nb=$('#nb'),cp=UI.tab==='cp';nb.hidden=!n;nb.textContent=n;
  $('#hsub').hidden=!cp;const hc=$('#hcnt');hc.hidden=!cp;hc.innerHTML=`<b>${n}</b><small>未処理</small>`}

/* ---------- 操作 ---------- */
const cpCur=()=>CP.cards.find(x=>x.id===UI.cid);
function cpSetChk(c,p,key,val){const s=cpSt(c,p);if(val==null)delete s.chk[key];else s.chk[key]=val;cpSave()}
function cpRerender(){const m=$('#view'),y=m.scrollTop;render();m.scrollTop=y}
function cpFinish(c,p,ref){const s=cpSt(c,p);s.done={at:new Date().toISOString(),ref:String(ref||'').trim().slice(0,500)};
  if(c.platform.every(x=>cpSt(c,x).done)){c.doneAt=s.done.at;cpSave();closeSheet();UI.cv='queue';toast(`${DONE_J[c.kind]}として履歴に移しました`);render();$('#view').scrollTop=0;return}
  cpSave();closeSheet();const nx=c.platform.find(x=>!cpSt(c,x).done);UI.cplat[c.id]=nx;toast(`${PLAT_J[p]}を記録しました。残り：${PLAT_J[nx]}`);render();$('#view').scrollTop=0}
function cpExport(){const done=CP.cards.filter(c=>c.doneAt);
  const out={version:1,type:'posta_cards_history',app:'POSTA v'+APP_VER,exportedAt:new Date().toISOString(),
    cards:done.map(c=>({id:c.id,kind:c.kind,status:DONE_CODE[c.kind],platform:c.platform.length===1?c.platform[0]:c.platform,itemRef:c.itemRef,work:c.work,sub:c.sub,currentPrice:c.currentPrice,completedAt:c.doneAt,
      results:c.platform.map(p=>{const d=cpSt(c,p).done||{},ref=d.ref||'',u=/^https?:\/\//i.test(ref);
        return{platform:p,completedAt:d.at||null,listingUrl:u?ref:null,listingId:ref&&!u?ref:null,price:cpPrice(c,p),
          fields:cpView(c,p).fields.map(f=>Object.assign({type:f.type,label:f.label,value:cpVal(c,p,f)},f.currentValue!=null?{currentValue:f.currentValue}:{},cpSt(c,p).ed[f.key]!=null?{editedByUser:true}:{}))}}),
      memo:c.memo||null})),
    notes:cpOpen().filter(c=>c.memo).map(c=>({id:c.id,work:c.work,holdReason:c.holdReason,memo:c.memo}))};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download=`posta_cards_history_${ymd(Date.now()).replace(/-/g,'')}.json`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(`履歴 ${out.cards.length}件を書き出しました`);return out}
function cpPriceLive(el){const c=cpCur();if(!c)return;const p=cpPlat(c),n=num(el.value);if(!(n>=0))return;
  const v=cpView(c,p).price||{},rate=cpFee(c,p),fee=Math.round(n*rate/100),net=n-fee-(v.shipping||0)-(v.packing||0),pr=v.cost!=null?net-v.cost:null;
  const f=$('#cpFeeL');if(f)f.textContent=`手数料 −${yen(fee)}（${rate}%）／ 送料 −${yen(v.shipping||0)} ／ 梱包 −${yen(v.packing||0)}`;
  const a=$('#cpNet');if(a)a.textContent=yen(net);const b=$('#cpProfit');if(b){b.textContent=pr!=null?yen(pr):'—';b.className=pr==null?'':pr>=0?'pos':'neg'}
  const w=$('#cpFloorW');if(w)w.hidden=!(v.floor!=null&&n<v.floor)}
async function cpImportFile(file){if(!file)return;if(file.size>CP_MAX_FILE){UI.cpMsg='ファイルが大きすぎます（1MBまで）';cpRerender();return}
  let obj;try{obj=JSON.parse(await file.text())}catch(e){UI.cpMsg='JSONとして読めませんでした（'+file.name+'）';cpRerender();return}
  const r=cpImport(obj);UI.cpMsg=cpImportMsg(r);toast(UI.cpMsg);cpRerender()}
/* ---------- v2.1.1：自動取得（アプリと同じ場所の posta_cards_update.json だけ。相対パス固定・同一オリジン） ----------
   取り込み規則は cpImport に任せる。manual=false（起動時）は追加・置き換えがあったときだけ知らせ、それ以外は無言。 */
const CP_UPDATE_PATH='posta_cards_update.json';let cpAutoDone=false;
async function cpAutoFetch(manual){
  if(!/^https?:$/.test(location.protocol)){if(manual){UI.cpMsg='取り込めませんでした：http/https で開いたときだけ更新を確認できます';cpRerender()}return null}
  if(UI.cpBusy){if(manual){UI.cpMsg='更新を確認しています…（少し待ってからもう一度押してください）';cpRerender()}return null}UI.cpBusy=true;if(manual){UI.cpMsg='更新を確認しています…';cpRerender()}
  let r;
  try{const res=await fetch(CP_UPDATE_PATH,{cache:'no-store',credentials:'same-origin',redirect:'error'});
    if(!res.ok)r={err:res.status===404?'更新ファイルが置かれていません（404）':`更新ファイルを取得できませんでした（HTTP ${res.status}）`};
    else{const t=await res.text();
      if(t.length>CP_MAX_FILE)r={err:'ファイルが大きすぎます（1MBまで）'};
      else{let obj=null;try{obj=JSON.parse(t)}catch(e){}r=cpImport(obj)}}}
  catch(e){r={err:'更新ファイルを取得できませんでした（通信エラー・オフライン）'}}
  finally{UI.cpBusy=false}
  const changed=!r.err&&!r.ignored&&(r.added||r.replaced)>0;
  if(manual){UI.cpMsg=r.ignored?`最新の状態です（version ${r.v} は取り込み済み・現在 ${r.cur}）`:cpImportMsg(r);toast(UI.cpMsg);cpRerender()}
  else if(changed){UI.cpMsg=cpImportMsg(r);toast(UI.cpMsg);
    const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#view').contains(a))cpBadges();else cpRerender()}
  return r}
function cpAutoStart(){if(cpAutoDone)return;cpAutoDone=true;if(/^https?:$/.test(location.protocol))cpAutoFetch(false)}
const CP_ACT={
  cpQk(b){UI.qk=b.dataset.v;render()},
  cpGo(b){UI.cv=b.dataset.v;render();$('#view').scrollTop=0},
  cpOpen(b){UI.cid=b.dataset.id;UI.cv='card';render();$('#view').scrollTop=0},
  cpPlat(b){const c=cpCur();if(!c||!c.platform.includes(b.dataset.v))return;UI.cplat[c.id]=b.dataset.v;cpRerender()},
  async cpCopy(b){const c=cpCur();if(!c||c.holdReason)return;const p=cpPlat(c),f=cpField(c,p,b.dataset.k);if(!f)return;const t=cpVal(c,p,f);
    if(await cpCopyText(t)){toast('コピーしました');cpSetChk(c,p,f.key,t);cpRerender()}},
  async cpQCopy(b){const c=CP.cards.find(x=>x.id===b.dataset.id);if(!c||c.holdReason)return;const p=cpPlat(c),f=cpField(c,p,b.dataset.k);if(!f)return;const t=cpVal(c,p,f);
    if(await cpCopyText(t)){toast(`コピーしました（${PLAT_J[p]}）`);cpSetChk(c,p,f.key,t);cpRerender()}},
  cpChk(b){const c=cpCur();if(!c||c.holdReason)return;const p=cpPlat(c),k=b.dataset.k,s=cpSt(c,p);
    const val=k==='@price'?String(cpPrice(c,p)):(()=>{const f=cpField(c,p,k);return f?cpVal(c,p,f):null})();if(val==null)return;
    cpSetChk(c,p,k,s.chk[k]===val?null:val);cpRerender()},
  cpPh(b){const c=cpCur();if(!c||c.holdReason)return;const p=cpPlat(c),i=+b.dataset.i,l=cpView(c,p).photos[i];if(l==null)return;
    cpSetChk(c,p,'@ph'+i,cpSt(c,p).chk['@ph'+i]===l?null:l);cpRerender()},
  cpEdit(b){const c=cpCur();if(!c||c.holdReason)return;const p=cpPlat(c),f=cpField(c,p,b.dataset.k);if(!f)return;UI.cpEditK=f.key;
    openSheet(`${f.label}を編集（${PLAT_J[p]}）`,`<div class="fld"><textarea id="cpEd">${esc(cpVal(c,p,f))}</textarea></div>
    <div class="note">ここで直した値は、次の取り込みでも上書きされません。国ちゃん案に戻したいときは「案に戻す」。</div>
    <div class="btns" style="margin-top:12px"><button class="btn pri wide" data-act="cpEdSave">保存</button><button class="btn" data-act="cpEdReset">案に戻す</button></div>`)},
  cpEdSave(){const c=cpCur();if(!c)return;const p=cpPlat(c),f=cpField(c,p,UI.cpEditK);if(!f)return;const v=$('#cpEd').value;const s=cpSt(c,p);
    if(v===f.value)delete s.ed[f.key];else s.ed[f.key]=v;cpSave();closeSheet();cpRerender();toast('保存しました')},
  cpEdReset(){const c=cpCur();if(!c)return;const p=cpPlat(c);delete cpSt(c,p).ed[UI.cpEditK];cpSave();closeSheet();cpRerender();toast('国ちゃん案に戻しました')},
  cpPriceReset(){const c=cpCur();if(!c)return;delete cpSt(c,cpPlat(c)).ed['@price'];cpSave();cpRerender()},
  cpFinish(){const c=cpCur();if(!c||c.holdReason)return;const p=cpPlat(c),g=cpProg(c,p);if(g.done<g.total)return;
    if(c.kind!=='draft'){cpFinish(c,p,'');return}
    openSheet(`出品完了を記録（${PLAT_J[p]}）`,`<div class="note" style="margin-bottom:8px">出品したページのURL、または出品ID（商品ID）を入れてください。空欄でも記録できます。</div>
    <div class="fld"><label>出品URL または 出品ID（任意）</label><input id="cpRef" inputmode="url" autocomplete="off" placeholder="https://jp.mercari.com/item/m… または m…"></div>
    <div class="btns"><button class="btn pri wide" data-act="cpFinishGo">記録する</button></div>`)},
  cpFinishGo(){const c=cpCur();if(!c)return;cpFinish(c,cpPlat(c),($('#cpRef')||{}).value)},
  cpUndoPlat(){const c=cpCur();if(!c||!confirm('この販路の完了記録を取り消しますか？'))return;cpSt(c,cpPlat(c)).done=null;c.doneAt=null;cpSave();cpRerender()},
  cpReopen(b){const c=CP.cards.find(x=>x.id===b.dataset.id);if(!c||!confirm(`「${c.work}」をキューに戻しますか？（完了の記録は消えます）`))return;
    c.doneAt=null;c.platform.forEach(p=>{cpSt(c,p).done=null});cpSave();cpRerender();toast('キューに戻しました')},
  cpExport(){cpExport()},
  cpCheck(){cpAutoFetch(true)},
};

/* ---------- 描画・操作 ---------- */
function render(){$('#ver').textContent='v'+APP_VER;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  cpBadges();
  $('#view').innerHTML=UI.tab==='tpl'?tplHTML():UI.tab==='cp'?cpHTML():calcHTML()}
const ACT={
  closeSheet(){closeSheet()},
  tChip(b){UI.tcat=b.dataset.v;render()},
  newTpl(){openTpl(null)},
  tplEdit(b){openTpl(b.dataset.id)},
  tplCopy(b){tplCopy(b.dataset.id)},
  tplFav(b){const t=S.templates.find(x=>x.id===b.dataset.id);if(!t)return;t.fav=t.fav?0:1;save();render();toast(t.fav?'★ 上に固定しました':'★ を外しました')},
  insVar(b){const ta=$('#tB');const s=ta.selectionStart??ta.value.length,e=ta.selectionEnd??s;ta.value=ta.value.slice(0,s)+b.dataset.v+ta.value.slice(e);ta.focus();const p=s+b.dataset.v.length;ta.setSelectionRange(p,p)},
  tplSave(){const title=$('#tT').value.trim(),body=$('#tB').value;if(!title&&!body.trim()){toast('名前か本文を入力してください');return}
    const isNew=TEDIT._new;delete TEDIT._new;Object.assign(TEDIT,{title:title||body.trim().slice(0,16),category:$('#tC').value,body,updatedAt:Date.now()});
    if(isNew)S.templates.push(TEDIT);else{const i=S.templates.findIndex(x=>x.id===TEDIT.id);if(i>=0)S.templates[i]=TEDIT}
    save();closeSheet();render();toast('保存しました')},
  tplDel(){if(!TEDIT||!confirm(`「${TEDIT.title}」を削除しますか？`))return;S.templates=S.templates.filter(x=>x.id!==TEDIT.id);save();closeSheet();render();toast('削除しました')},
  fillCopy(){if(!FILL)return;const t=S.templates.find(x=>x.id===FILL.id);if(!t)return;copyText(fillText(t.body,FILL.vs,fillVals()));closeSheet()},
  calcRun(){document.querySelectorAll('[data-c]').forEach(e=>C[e.dataset.c]=e.value);calcRun()},
  calcClear(){calcReset();render()},
  oldExport(){oldExport()},
};
Object.assign(ACT,CP_ACT);
document.addEventListener('click',e=>{
  const tb=e.target.closest('#tabs button');if(tb){UI.tab=tb.dataset.tab;render();$('#view').scrollTop=0;return}
  const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e)}});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='tq'){UI.tq=el.value;clearTimeout(UI.tqT);UI.tqT=setTimeout(()=>{const pos=el.selectionStart;render();const n=$('#tq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},250);return}
  if(el.dataset.c){C[el.dataset.c]=el.value;if(el.dataset.c==='lp'||el.dataset.c==='lv'||el.dataset.c==='lr'){const u=$('#rU');if(u)u.textContent=perVolTxt();const cp=$('#rCap');if(cp)cp.textContent=capTxt()}
    else if(['rc','rs','rf','rr'].includes(el.dataset.c))needUpdate();return}
  if(el.dataset.cpprice!==undefined){cpPriceLive(el);return}
  if(el.dataset.cpmemo!==undefined){const c=cpCur();if(c){c.memo=el.value.slice(0,2000);clearTimeout(UI.cpMemoT);UI.cpMemoT=setTimeout(cpSave,400)}return}
  if(el.dataset.fv!==undefined&&FILL){const t=S.templates.find(x=>x.id===FILL.id);const pv=$('#fillPv');if(t&&pv)pv.textContent=fillText(t.body,FILL.vs,fillVals())}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='cpFile'){const f=el.files&&el.files[0];el.value='';cpImportFile(f);return}
  if(el.dataset.cpmemo!==undefined){cpSave();return}
  if(el.dataset.cpprice!==undefined){const c=cpCur();if(!c)return;const p=cpPlat(c),n=num(el.value);if(!(n>=0)){toast('数字で入力してください');cpRerender();return}
    const v=cpView(c,p).price,s=cpSt(c,p);if(v&&v.price===Math.round(n))delete s.ed['@price'];else s.ed['@price']=Math.round(n);cpSave();cpRerender();return}
  if(el.dataset.cpset){const [g,p]=el.dataset.cpset.split('.');const n=num(el.value);
    if(!isFinite(n)||n<0||(g==='fee'&&n>=100)||(g!=='fee'&&(n<1||!Number.isInteger(n)))){toast('数字で入力してください');el.value=CP.settings[g][p];return}
    CP.settings[g][p]=n;el.value=n;cpSave();toast('保存しました');return}
  if(el.dataset.set){const k=el.dataset.set;const n=num(el.value);if(!isFinite(n)||n<0||(k==='feePct'&&n>=100)){toast('数字で入力してください');el.value=S.settings[k];return}
    const ck=k==='feePct'?'fee':'ship';if(C&&!C.res&&String(C[ck])===String(S.settings[k])){C[ck]=String(n);const ci=document.querySelector(`[data-c=${ck}]`);if(ci)ci.value=C[ck]}
    S.settings[k]=n;el.value=n;save();toast('初期値を保存しました')}});
// v2.0.3：新設の lr/rc/rs/rf/rr は利益計算と独立なので、Enterはキーボードを閉じるだけ（利益計算は走らせない）
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&(e.target.dataset.cpprice!==undefined||e.target.dataset.cpset)){e.preventDefault();e.target.blur();return}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.c){e.preventDefault();e.target.blur();if(!['lr','rc','rs','rf','rr'].includes(e.target.dataset.c))ACT.calcRun()}});
render();
cpAutoStart();
